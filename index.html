<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartRent Pro - Quản lý Nhà & Phòng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <!-- Firebase compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA5ON_sua8K35d9mqXD03QXKH-wYbJMnwE",
            authDomain: "smartrent-pro.firebaseapp.com",
            databaseURL: "https://smartrent-pro-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "smartrent-pro",
            storageBucket: "smartrent-pro.firebasestorage.app",
            messagingSenderId: "242294251498",
            appId: "1:242294251498:web:6002618e3e14d488989c93"
        };
        firebase.initializeApp(firebaseConfig);
        window._fbDb = firebase.database();
        window._fbAuth = firebase.auth();
        window._fbReady = true;
        console.log('✅ Firebase ready!');
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    <style>
        /* PIN keypad style */
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #3b82f6; transition: all 0.15s; }
        .pin-dot.filled { background: #3b82f6; transform: scale(1.1); }
        .pin-key { transition: all 0.1s; }
        .pin-key:active { transform: scale(0.92); }
        @keyframes pinShake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
        .pin-shake { animation: pinShake 0.4s ease; }
        @keyframes pinSuccess { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
        .pin-success { animation: pinSuccess 0.3s ease; }
    </style>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9; --border: #e2e8f0;
            --text: #0f172a; --text2: #475569; --text3: #94a3b8;
            --nav-bg: rgba(255,255,255,0.92); --nav-border: rgba(226,232,240,0.8);
            --input-bg: #f1f5f9; --card-shadow: 0 1px 3px rgba(0,0,0,0.07);
        }
        .dark {
            --bg: #0f172a; --surface: #1e293b; --surface2: #293548; --border: #334155;
            --text: #f1f5f9; --text2: #94a3b8; --text3: #475569;
            --nav-bg: rgba(15,23,42,0.95); --nav-border: rgba(51,65,85,0.8);
            --input-bg: #293548; --card-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; background-color: var(--bg); color: var(--text); transition: background-color 0.3s, color 0.3s; }
        .glass-nav { background: var(--nav-bg); backdrop-filter: blur(10px); border-top: 1px solid var(--nav-border); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .invoice-box { box-shadow: 0 20px 50px -12px rgba(0,0,0,0.1); border: 1px solid #f1f5f9; }
        .tab-active { color: #2563eb; position: relative; }
        .tab-active::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: #2563eb; border-radius: 50%; }
        .theme-toggle { transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); }
        .theme-toggle:active { transform: rotate(30deg) scale(0.9); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- UTILS ---
        const formatVND = (num) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num || 0);
        const formatNum = (v) => v ? v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "0";
        const parseNum = (v) => {
            if (typeof v === 'number') return v;
            return parseInt(v.toString().replace(/\./g, "")) || 0;
        };
        const generateID = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
        const getMonthStr = (date = new Date()) => date.toISOString().slice(0, 7);
        const removeAccents = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");

        // --- COMPONENTS ---
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in">
                    <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-lg rounded-t-[2.5rem] sm:rounded-[2rem] max-h-[94vh] flex flex-col overflow-hidden shadow-2xl" style={{background: 'var(--surface)'}}>
                        <div className="p-6 border-b flex justify-between items-center" style={{borderColor: 'var(--border)'}}>
                            <h3 className="font-black text-xl" style={{color: 'var(--text)'}}>{title}</h3>
                            <button onClick={onClose} className="p-2 rounded-full" style={{background: 'var(--surface2)', color: 'var(--text2)'}}>
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 no-scrollbar" style={{background: 'var(--surface)'}}>{children}</div>
                    </div>
                </div>
            );
        };

        const Input = ({ label, value, onChange, type="text", placeholder="", suffix="" }) => (
            <div className="mb-4">
                <label className="text-[10px] font-black uppercase tracking-widest ml-1 mb-1 block" style={{color: 'var(--text3)'}}>{label}</label>
                <div className="relative">
                    <input 
                        type={type === 'number' ? 'text' : type}
                        value={type === 'number' ? formatNum(value) : value}
                        onChange={(e) => onChange(type === 'number' ? parseNum(e.target.value) : e.target.value)}
                        placeholder={placeholder}
                        className="w-full p-4 rounded-2xl border-2 border-transparent outline-none font-bold transition-all focus:border-blue-500"
                        style={{background: 'var(--input-bg)', color: 'var(--text)'}}
                    />
                    {suffix && <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold" style={{color: 'var(--text3)'}}>{suffix}</span>}
                </div>
            </div>
        );

        // --- AUTH CONSTANTS ---
        const ADMIN_UID = 'kDC5EN8rJSf834zc5BGwCkdFudD3';
        const getPinKey = (uid) => `sr_pin_${uid}`;
        const getUnlockedKey = (uid) => `sr_unlocked_${uid}`;

        const hashPIN = async (pin) => {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('smartrent_salt_' + pin));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
        };

        // --- LOGIN SCREEN ---
        const LoginScreen = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [showPw, setShowPw] = useState(false);

            const handleLogin = async () => {
                if (!email || !password) return setError('Vui lòng nhập đầy đủ thông tin');
                setLoading(true); setError('');
                try {
                    const cred = await window._fbAuth.signInWithEmailAndPassword(email.trim(), password);
                    onLogin(cred.user);
                } catch(e) {
                    setError('Email hoặc mật khẩu không đúng!');
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center px-8" style={{background:'var(--bg)'}}>
                    <div className="w-full max-w-xs flex flex-col gap-6">
                        <div className="text-center">
                            <div className="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-xl shadow-blue-200">
                                <svg className="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                            </div>
                            <h1 className="text-3xl font-black" style={{color:'var(--text)'}}>SmartRent <span className="text-blue-600">Pro</span></h1>
                            <p className="text-xs font-bold mt-1 uppercase tracking-widest" style={{color:'var(--text3)'}}>Đăng nhập để tiếp tục</p>
                        </div>

                        <div className="space-y-3">
                            <div>
                                <label className="text-[10px] font-black uppercase tracking-widest ml-1 mb-1 block" style={{color:'var(--text3)'}}>Email</label>
                                <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
                                    placeholder="your@email.com"
                                    className="w-full p-4 rounded-2xl border-2 border-transparent outline-none font-bold focus:border-blue-500"
                                    style={{background:'var(--input-bg)', color:'var(--text)'}}
                                    onKeyDown={e => e.key==='Enter' && handleLogin()}
                                />
                            </div>
                            <div>
                                <label className="text-[10px] font-black uppercase tracking-widest ml-1 mb-1 block" style={{color:'var(--text3)'}}>Mật khẩu</label>
                                <div className="relative">
                                    <input type={showPw ? 'text' : 'password'} value={password} onChange={e=>setPassword(e.target.value)}
                                        placeholder="••••••••"
                                        className="w-full p-4 rounded-2xl border-2 border-transparent outline-none font-bold focus:border-blue-500 pr-12"
                                        style={{background:'var(--input-bg)', color:'var(--text)'}}
                                        onKeyDown={e => e.key==='Enter' && handleLogin()}
                                    />
                                    <button onClick={()=>setShowPw(!showPw)} className="absolute right-4 top-1/2 -translate-y-1/2" style={{color:'var(--text3)'}}>
                                        {showPw ? <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/></svg>
                                        : <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {error && <p className="text-red-400 text-xs font-bold text-center animate-fade-in">{error}</p>}

                        <button onClick={handleLogin} disabled={loading}
                            className="w-full p-4 rounded-2xl font-black text-white shadow-xl shadow-blue-200 flex items-center justify-center gap-2"
                            style={{background: loading ? '#93c5fd' : '#2563eb'}}>
                            {loading ? <><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Đang đăng nhập...</> : 'Đăng nhập'}
                        </button>
                    </div>
                </div>
            );
        };

        // --- PIN SCREEN ---
        const PinScreen = ({ mode, onSuccess, storedHash, onLogout }) => {
            const [digits, setDigits] = useState([]);
            const [status, setStatus] = useState('idle');

            const handleKey = async (k) => {
                if (status !== 'idle') return;
                if (k === 'del') { setDigits(d => d.slice(0, -1)); return; }
                const next = [...digits, k];
                setDigits(next);
                if (next.length === 4) {
                    const h = await hashPIN(next.join(''));
                    if (mode === 'setup') {
                        setStatus('success');
                        setTimeout(() => onSuccess(h), 400);
                    } else {
                        if (h === storedHash) {
                            setStatus('success');
                            setTimeout(() => onSuccess(), 400);
                        } else {
                            setStatus('error');
                            setTimeout(() => { setDigits([]); setStatus('idle'); }, 600);
                        }
                    }
                }
            };

            const keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
            return (
                <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center" style={{background:'var(--bg)'}}>
                    <div className="flex flex-col items-center gap-10 w-full max-w-xs px-8">
                        <div className="text-center">
                            <div className="w-16 h-16 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-xl shadow-blue-200">
                                <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            </div>
                            <h1 className="text-2xl font-black" style={{color:'var(--text)'}}>SmartRent <span className="text-blue-600">Pro</span></h1>
                            <p className="text-sm font-bold mt-1" style={{color:'var(--text3)'}}>{mode === 'setup' ? 'Tạo mã PIN 4 số của bạn' : 'Nhập PIN để mở khóa'}</p>
                        </div>

                        <div className={`flex gap-4 ${status === 'error' ? 'pin-shake' : ''} ${status === 'success' ? 'pin-success' : ''}`}>
                            {[0,1,2,3].map(i => (
                                <div key={i} className={`pin-dot ${digits.length > i ? 'filled' : ''} ${status === 'error' ? '!border-red-400 !bg-red-400' : ''} ${status === 'success' ? '!border-emerald-500 !bg-emerald-500' : ''}`}></div>
                            ))}
                        </div>

                        <div className="grid grid-cols-3 gap-4 w-full">
                            {keys.map((k, i) => k === '' ? <div key={i}></div> : (
                                <button key={i} onClick={() => handleKey(k)}
                                    className={`pin-key h-16 rounded-2xl font-black text-xl flex items-center justify-center shadow-sm border`}
                                    style={{background:'var(--surface)', borderColor:'var(--border)', color: k==='del' ? '#f87171' : 'var(--text)'}}>
                                    {k === 'del' ? <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"/></svg> : k}
                                </button>
                            ))}
                        </div>
                        {status === 'error' && <p className="text-red-400 font-bold text-sm animate-fade-in">PIN không đúng, thử lại!</p>}
                        {onLogout && <button onClick={onLogout} className="text-xs font-bold" style={{color:'var(--text3)'}}>Đăng xuất tài khoản khác</button>}
                    </div>
                </div>
            );
        };

        // --- FIREBASE SYNC HOOK ---
        const useFirebaseSync = (uid) => {
            const [data, setData] = useState(null);
            const [synced, setSynced] = useState(false);

            useEffect(() => {
                if (!uid || !window._fbDb) return;
                const ref = window._fbDb.ref(`users/${uid}/data`);
                console.log('🔌 Connecting Firebase for uid:', uid);
                ref.on('value', (snap) => {
                    console.log('📦 Firebase data received for', uid);
                    setData(snap.val() || null);
                    setSynced(true);
                }, (err) => {
                    console.error('❌ Firebase read error:', err);
                    setSynced(true);
                });
                return () => ref.off('value');
            }, [uid]);

            const pushData = useCallback((uid, newData) => {
                if (!window._fbDb || !uid) return;
                window._fbDb.ref(`users/${uid}/data`).set(newData)
                    .then(() => console.log('✅ Synced!'))
                    .catch(e => console.error('❌ Write error:', e));
            }, []);

            return { data, synced, pushData };
        };

        // ============================================================
        // PaymentLogModal — Sổ thu tiền từng phần
        // ============================================================
        const PaymentLogModal = ({ bill, onClose, paymentLogs, setPaymentLogs, bills, setBills, rooms }) => {
            const [amount, setAmount] = useState(0);
            const [dueDate, setDueDate] = useState('');
            const [note, setNote] = useState('');

            useEffect(() => {
                if (bill) { setAmount(0); setDueDate(''); setNote(''); }
            }, [bill?.id]);

            if (!bill) return null;

            const room = rooms.find(r => r.id === bill.roomId);
            const logs = paymentLogs.filter(l => l.billId === bill.id).sort((a,b) => b.createdAt - a.createdAt);
            const paidAmt = bill.paidAmount || 0;
            const debtAmt = bill.total - paidAmt;
            const isFullPaid = bill.paid;

            const handleAddLog = () => {
                if (!amount || amount <= 0) return;
                const newLog = {
                    id: generateID(),
                    billId: bill.id,
                    roomId: bill.roomId,
                    amount: Math.min(amount, debtAmt),
                    dueDate: dueDate || null,
                    note: note.trim(),
                    createdAt: Date.now(),
                };
                setPaymentLogs(prev => [...prev, newLog]);
                // Cập nhật paidAmount trên bill
                const newPaid = Math.min(paidAmt + newLog.amount, bill.total);
                const nowFull = newPaid >= bill.total;
                setBills(bills.map(b => b.id === bill.id
                    ? { ...b, paidAmount: newPaid, paid: nowFull }
                    : b
                ));
                setAmount(0); setDueDate(''); setNote('');
            };

            const handleDeleteLog = (logId, logAmount) => {
                setPaymentLogs(prev => prev.filter(l => l.id !== logId));
                const newPaid = Math.max(0, paidAmt - logAmount);
                setBills(bills.map(b => b.id === bill.id
                    ? { ...b, paidAmount: newPaid, paid: false }
                    : b
                ));
            };

            return (
                <Modal isOpen={!!bill} onClose={onClose} title={`Sổ thu · P.${room?.name || ''}`}>
                    {/* Tổng quan hóa đơn */}
                    <div className="grid grid-cols-3 gap-2 mb-5">
                        <div className="p-3 rounded-2xl text-center border" style={{background:'var(--surface2)', borderColor:'var(--border)'}}>
                            <p className="text-[8px] font-black uppercase tracking-widest mb-1" style={{color:'var(--text3)'}}>Tổng HĐ</p>
                            <p className="text-xs font-black" style={{color:'var(--text)'}}>{formatVND(bill.total)}</p>
                        </div>
                        <div className="p-3 rounded-2xl text-center" style={{background:'#ecfdf5'}}>
                            <p className="text-[8px] font-black uppercase tracking-widest mb-1 text-emerald-600">Đã thu</p>
                            <p className="text-xs font-black text-emerald-600">{formatVND(paidAmt)}</p>
                        </div>
                        <div className="p-3 rounded-2xl text-center" style={{background: debtAmt > 0 ? '#fff7ed' : '#ecfdf5'}}>
                            <p className="text-[8px] font-black uppercase tracking-widest mb-1" style={{color: debtAmt > 0 ? '#f97316' : '#10b981'}}>Còn nợ</p>
                            <p className="text-xs font-black" style={{color: debtAmt > 0 ? '#f97316' : '#10b981'}}>{formatVND(debtAmt)}</p>
                        </div>
                    </div>

                    {/* Form ghi thu tiền */}
                    {!isFullPaid && (
                        <div className="p-4 rounded-2xl border mb-5" style={{background:'var(--surface2)', borderColor:'var(--border)'}}>
                            <p className="text-[9px] font-black uppercase tracking-widest mb-3" style={{color:'var(--text3)'}}>Ghi thu tiền</p>
                            <div className="space-y-3">
                                <div>
                                    <label className="text-[9px] font-black uppercase tracking-widest mb-1 block" style={{color:'var(--text3)'}}>Số tiền thu</label>
                                    <div className="relative">
                                        <input
                                            type="text"
                                            value={formatNum(amount)}
                                            onChange={e => setAmount(Math.min(parseNum(e.target.value), debtAmt))}
                                            placeholder="0"
                                            className="w-full p-3 rounded-xl font-black text-sm border-2 border-transparent focus:border-blue-500 outline-none"
                                            style={{background:'var(--surface)', color:'var(--text)'}}
                                        />
                                        <button onClick={() => setAmount(debtAmt)}
                                            className="absolute right-2 top-1/2 -translate-y-1/2 text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-lg">
                                            Hết nợ
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[9px] font-black uppercase tracking-widest mb-1 block" style={{color:'var(--text3)'}}>Hẹn trả phần còn lại</label>
                                    <input
                                        type="date"
                                        value={dueDate}
                                        onChange={e => setDueDate(e.target.value)}
                                        className="w-full p-3 rounded-xl font-bold text-sm border-2 border-transparent focus:border-blue-500 outline-none"
                                        style={{background:'var(--surface)', color:'var(--text)'}}
                                    />
                                </div>
                                <div>
                                    <label className="text-[9px] font-black uppercase tracking-widest mb-1 block" style={{color:'var(--text3)'}}>Ghi chú</label>
                                    <input
                                        type="text"
                                        value={note}
                                        onChange={e => setNote(e.target.value)}
                                        placeholder="VD: Trả thêm cuối tháng..."
                                        className="w-full p-3 rounded-xl font-bold text-sm border-2 border-transparent focus:border-blue-500 outline-none"
                                        style={{background:'var(--surface)', color:'var(--text)'}}
                                    />
                                </div>
                                <button onClick={handleAddLog}
                                    className="w-full p-3 bg-blue-600 text-white font-black rounded-xl text-sm shadow-lg shadow-blue-100">
                                    + Ghi nhận thu tiền
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Lịch sử thu tiền */}
                    <div>
                        <p className="text-[9px] font-black uppercase tracking-widest mb-3" style={{color:'var(--text3)'}}>
                            Lịch sử thu ({logs.length} lần)
                        </p>
                        {logs.length === 0 && (
                            <p className="text-center py-6 text-xs font-bold" style={{color:'var(--text3)'}}>Chưa có lần thu nào</p>
                        )}
                        <div className="space-y-2">
                            {logs.map(log => {
                                const isOverdue = log.dueDate && !isFullPaid && new Date(log.dueDate) < new Date();
                                return (
                                    <div key={log.id} className={`p-3 rounded-2xl border ${isOverdue ? 'border-red-200 bg-red-50' : ''}`}
                                        style={!isOverdue ? {background:'var(--surface)', borderColor:'var(--border)'} : {}}>
                                        <div className="flex justify-between items-start">
                                            <div className="flex-1">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="text-sm font-black text-emerald-600">+{formatVND(log.amount)}</span>
                                                    {isOverdue && <span className="text-[9px] font-black text-red-500 bg-red-100 px-2 py-0.5 rounded-full">⚠️ Quá hạn</span>}
                                                </div>
                                                <p className="text-[10px] font-bold" style={{color:'var(--text3)'}}>
                                                    🕐 {new Date(log.createdAt).toLocaleString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'})}
                                                </p>
                                                {log.dueDate && (
                                                    <p className={`text-[10px] font-bold mt-0.5 ${isOverdue ? 'text-red-500' : ''}`} style={!isOverdue ? {color:'var(--text3)'} : {}}>
                                                        📅 Hẹn: {new Date(log.dueDate).toLocaleDateString('vi-VN')}
                                                    </p>
                                                )}
                                                {log.note && <p className="text-[10px] font-bold mt-0.5" style={{color:'var(--text2)'}}>💬 {log.note}</p>}
                                            </div>
                                            <button onClick={() => handleDeleteLog(log.id, log.amount)}
                                                className="p-1.5 rounded-xl text-red-400 flex-shrink-0" style={{background:'var(--surface2)'}}>
                                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </Modal>
            );
        };

        // ============================================================
        // QRImage: load về base64 qua Image() + canvas ẩn
        // ============================================================
        const QRImage = ({ src, onReady }) => {
            const [b64, setB64] = useState('');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(false);

            useEffect(() => {
                if (!src) { setLoading(false); setError(true); onReady && onReady(null); return; }
                setLoading(true); setError(false); setB64(''); onReady && onReady(null);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const cv = document.createElement('canvas');
                        cv.width = img.naturalWidth || 400;
                        cv.height = img.naturalHeight || 400;
                        const ctx = cv.getContext('2d');
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, cv.width, cv.height);
                        ctx.drawImage(img, 0, 0);
                        const dataUrl = cv.toDataURL('image/png');
                        setB64(dataUrl); setLoading(false); onReady && onReady(dataUrl);
                    } catch(e) {
                        setB64(src); setLoading(false); onReady && onReady(src);
                    }
                };
                img.onerror = () => { setError(true); setLoading(false); onReady && onReady(null); };
                img.src = src + (src.includes('?') ? '&' : '?') + '_cb=' + Date.now();
            }, [src]);

            if (loading) return (
                <div className="w-56 h-56 flex flex-col items-center justify-center gap-2 bg-slate-50 rounded-2xl">
                    <div className="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                    <p className="text-[10px] text-slate-400 font-bold">Đang tải mã QR...</p>
                </div>
            );
            if (error) return (
                <div className="w-56 h-56 flex flex-col items-center justify-center gap-2 bg-red-50 rounded-2xl border border-red-100">
                    <p className="text-2xl">⚠️</p>
                    <p className="text-[10px] text-red-400 font-bold text-center px-4">Không tải được QR<br/>Kiểm tra tên ngân hàng & STK</p>
                </div>
            );
            return <img src={b64} alt="QR" className="w-56 h-56 object-contain" />;
        };

        // ============================================================
        // drawInvoiceCanvas: vẽ toàn bộ hóa đơn lên canvas thủ công
        // Tối ưu tỉ lệ cho mobile (width 1080px ~ A4 dọc chuẩn)
        // ============================================================
        const drawInvoiceCanvas = async ({ invoice, settings, chartDataUrl, qrDataUrl }) => {
            // Tỉ lệ 9:16 chuẩn mobile — nội dung dồn giữa, 2 bên thoáng
            const W   = 720;    // width hẹp = thon gọn
            const PAD = 48;     // padding nhỏ để CW chiếm ~87% width
            const CW  = W - PAD * 2;
            const fmt = (n) => new Intl.NumberFormat('vi-VN').format(n || 0) + ' đ';

            // Build danh sách dòng chi phí
            const feeLines = [];
            const fees = invoice.details?.otherFees || [];
            if (Array.isArray(fees)) fees.filter(f => f.amount > 0).forEach(f => feeLines.push([f.name || 'Phí khác', fmt(f.amount)]));
            else Object.entries(fees).forEach(([k,v]) => v > 0 && feeLines.push([k, fmt(v)]));

            // Tính chiều cao động
            const ROW_H   = 42;
            const baseH   = 310 + ROW_H * (2 + feeLines.length) + 100 + 90; // header+rows+total+totalbox
            const chartH  = chartDataUrl ? 260 : 0;
            const qrH     = qrDataUrl    ? 380 : 0;
            const footerH = 80;
            const H = baseH + chartH + qrH + footerH;

            const cv = document.createElement('canvas');
            cv.width  = W * 2;  // retina ×2
            cv.height = H * 2;
            const ctx = cv.getContext('2d');
            ctx.scale(2, 2);

            // --- Helpers ---
            const fill = (color) => { ctx.fillStyle = color; };

            const text = (str, x, y, opts = {}) => {
                ctx.save();
                ctx.font = `${opts.weight||'normal'} ${opts.size||28}px "Segoe UI", Arial, sans-serif`;
                ctx.fillStyle = opts.color || '#1e293b';
                ctx.textAlign = opts.align || 'left';
                ctx.textBaseline = opts.baseline || 'alphabetic';
                ctx.fillText(String(str ?? ''), x, y);
                ctx.restore();
            };

            const hline = (y, dash=false, color='#e2e8f0', lw=1.5) => {
                ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=lw;
                ctx.setLineDash(dash ? [8,6] : []);
                ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke();
                ctx.restore();
            };

            const roundRect = (x, y, w, h, r, fillColor, strokeColor=null) => {
                ctx.save(); ctx.fillStyle = fillColor;
                ctx.beginPath();
                ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
                ctx.quadraticCurveTo(x+w,y,x+w,y+r);
                ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
                ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
                ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
                ctx.closePath(); ctx.fill();
                if (strokeColor) { ctx.strokeStyle=strokeColor; ctx.lineWidth=1.5; ctx.stroke(); }
                ctx.restore();
            };

            // --- Nền trắng ---
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);

            let y = 56;

            // ===== HEADER =====
            text('BIÊN NHẬN TIỀN NHÀ', W/2, y+32, { weight:'900', size:26, color:'#0f172a', align:'center' });
            y += 52;
            text(`Phòng ${invoice.details.name} - ${invoice.details.occupants}`, W/2, y+20, { size:16, color:'#64748b', align:'center' });
            y += 36;

            // Badge tháng
            const badgeTxt = `THÁNG ${invoice.month}`;
            const bW = 160, bH = 30;
            roundRect(W/2-bW/2, y, bW, bH, 18, '#eff6ff');
            text(badgeTxt, W/2, y+26, { weight:'700', size:13, color:'#3b82f6', align:'center' });
            y += 60;
            hline(y, true);
            y += 36;

            // ===== ROWS =====
            const row = (label, value, labelColor='#64748b', valueColor='#0f172a', valueSz=20) => {
                text(label, PAD, y+ROW_H*0.72, { size:18, color:labelColor });
                text(value, W-PAD, y+ROW_H*0.72, { size:valueSz, weight:'700', color:valueColor, align:'right' });
                y += ROW_H;
            };

            row('Tiền phòng:', fmt(invoice.details.rentPrice));
            y += 8;

            // Block điện
            const eBlockH = 92;
            roundRect(PAD, y, CW, eBlockH, 16, '#f8fafc', '#e2e8f0');
            text(`Tiền điện (${invoice.eUsed} kWh):`, PAD+16, y+28, { weight:'700', size:18, color:'#2563eb' });
            text(fmt(invoice.details.eTotal), W-PAD-16, y+28, { weight:'700', size:18, color:'#0f172a', align:'right' });
            text(`Chỉ số: ${invoice.oldElectric} → ${invoice.newElectric} = ${invoice.eUsed} kWh`, PAD+16, y+54, { size:13, color:'#94a3b8' });
            text(`${invoice.eUsed} kWh × ${new Intl.NumberFormat('vi-VN').format(invoice.details.electricityPrice)} đ = ${fmt(invoice.details.eTotal)}`, PAD+16, y+74, { size:13, color:'#94a3b8' });
            y += eBlockH + 16;

            row('Tiền nước:', fmt(invoice.details.waterPrice));
            feeLines.forEach(([lbl, val]) => row(lbl+':', val));
            y += 8;

            hline(y);
            y += 20;

            // Dòng tổng cộng nổi bật
            text('Tổng cộng:', PAD, y+28, { weight:'700', size:20, color:'#0f172a' });
            text(fmt(invoice.total), W-PAD, y+28, { weight:'900', size:26, color:'#10b981', align:'right' });
            y += 48;

            // ===== TOTAL BOX =====
            const tBoxH = 70;
            roundRect(PAD, y, CW, tBoxH, 24, '#0f172a');
            text('TỔNG CỘNG THANH TOÁN', PAD+24, y+24, { size:13, weight:'700', color:'rgba(255,255,255,0.45)' });
            text(fmt(invoice.total), W-PAD-24, y+tBoxH*0.75, { size:28, weight:'900', color:'#34d399', align:'right' });
            y += tBoxH + 48;

            // ===== BIỂU ĐỒ =====
            if (chartDataUrl) {
                text('BIỂU ĐỒ TIÊU THỤ ĐIỆN NĂNG (kWh)', W/2, y+16, { size:13, weight:'700', color:'#94a3b8', align:'center' });
                y += 32;
                const chartImg = new Image();
                await new Promise(res => { chartImg.onload = res; chartImg.onerror = res; chartImg.src = chartDataUrl; });
                const chartDrawH = 160;
                roundRect(PAD, y, CW, chartDrawH+16, 16, '#f8fafc', '#e2e8f0');
                if (chartImg.complete && chartImg.naturalWidth > 0) {
                    ctx.drawImage(chartImg, PAD+8, y+8, CW-16, chartDrawH);
                }
                y += chartDrawH + 16 + 40;
            }

            // ===== QR CODE =====
            if (qrDataUrl) {
                hline(y, true);
                y += 32;
                const qrImg = new Image();
                await new Promise(res => { qrImg.onload = res; qrImg.onerror = res; qrImg.src = qrDataUrl; });
                const qrSize = 220;
                const qrPad  = 24;
                const qrBoxW = qrSize + qrPad*2;
                const qrBoxH = qrSize + qrPad*2;
                roundRect(W/2-qrBoxW/2, y, qrBoxW, qrBoxH, 24, '#f8fafc', '#e2e8f0');
                if (qrImg.complete && qrImg.naturalWidth > 0) {
                    ctx.drawImage(qrImg, W/2-qrSize/2, y+qrPad, qrSize, qrSize);
                }
                y += qrBoxH + 28;
                text(`${settings.bankName}  ·  ${settings.bankAcc}`, W/2, y+22, { weight:'700', size:18, color:'#0f172a', align:'center' });
                y += 32;
                text(settings.ownerName, W/2, y+20, { size:16, color:'#64748b', align:'center' });
                y += 36;
            }

            // ===== FOOTER =====
            hline(y, true);
            y += 28;
            text('Cảm ơn bạn đã đồng hành — trân trọng sự hợp tác của chúng ta 🤝', W/2, y+18, { size:14, color:'#94a3b8', align:'center' });

            return cv;
        };

        // --- INVOICE MODAL COMPONENT ---
        const InvoiceModal = ({ invoice, onClose, settings, bills, rooms, BillChart }) => {
            const [qrB64, setQrB64] = useState(null);   // base64 của QR ảnh
            const [qrReady, setQrReady] = useState(!settings.bankAcc);
            const [capturing, setCapturing] = useState(false);
            const chartRef = useRef(null); // ref tới canvas Chart.js

            useEffect(() => {
                setQrB64(null);
                setQrReady(!settings.bankAcc);
            }, [invoice?.id]);

            const handleCapture = async () => {
                if (!qrReady) return;
                setCapturing(true);
                try {
                    // Lấy base64 của biểu đồ từ canvas Chart.js trực tiếp
                    let chartDataUrl = null;
                    const chartCanvas = document.querySelector('#invoice-capture canvas');
                    if (chartCanvas) {
                        try { chartDataUrl = chartCanvas.toDataURL('image/png'); } catch(e) {}
                    }

                    const cv = await drawInvoiceCanvas({
                        invoice,
                        settings,
                        chartDataUrl,
                        qrDataUrl: qrB64,
                    });

                    const link = document.createElement('a');
                    link.download = `HD_P${invoice.details.name}_T${invoice.month}.png`;
                    link.href = cv.toDataURL('image/png');
                    link.click();
                } catch(e) {
                    console.error('Export error:', e);
                    alert('Xuất ảnh thất bại: ' + e.message);
                }
                setCapturing(false);
            };

            const qrSrc = settings.bankAcc
                ? `https://img.vietqr.io/image/${settings.bankName}-${settings.bankAcc}-compact2.png?amount=${invoice?.total}&addInfo=${encodeURIComponent(removeAccents(`PHONG ${invoice?.details?.name} THANG ${invoice?.month} ${invoice?.details?.occupants}`))}`
                : null;

            return (
                <Modal isOpen={!!invoice} onClose={onClose} title="Hóa đơn tiền nhà">
                    <div id="invoice-capture" className="bg-white p-6 invoice-box rounded-[2rem] text-slate-800">
                        <div className="text-center border-b-2 border-dashed border-slate-100 pb-5 mb-5">
                            <h2 className="text-xl font-black uppercase tracking-tighter text-slate-900 leading-tight">Biên nhận tiền nhà</h2>
                            <p className="text-xs font-bold text-slate-500 mt-1">Phòng {invoice?.details.name} - {invoice?.details.occupants}</p>
                            <p className="text-[9px] font-black uppercase tracking-widest text-blue-500 bg-blue-50 inline-block px-3 py-1 rounded-full mt-2">Tháng {invoice?.month}</p>
                        </div>

                        <div className="space-y-4 mb-6">
                            <div className="flex justify-between items-center text-sm">
                                <span className="font-bold text-slate-500">Tiền phòng:</span>
                                <span className="font-black text-slate-800">{formatVND(invoice?.details.rentPrice)}</span>
                            </div>
                            <div className="flex justify-between items-start bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <div className="text-sm">
                                    <p className="font-bold text-blue-600">Tiền điện ({invoice?.eUsed} kWh):</p>
                                    <p className="text-[10px] text-slate-400 font-bold mt-0.5">Số mới {invoice?.newElectric} − Số cũ {invoice?.oldElectric} = {invoice?.eUsed} kWh</p>
                                    <p className="text-[10px] text-slate-400 font-bold">{invoice?.eUsed} kWh × {formatVND(invoice?.details.electricityPrice)} = {formatVND(invoice?.details.eTotal)}</p>
                                </div>
                                <div className="text-right">
                                    <span className="font-black text-sm text-slate-800">{formatVND(invoice?.details.eTotal)}</span>
                                    <p className="text-[9px] text-slate-400 font-bold mt-0.5">{formatVND(invoice?.details.electricityPrice)} / kWh</p>
                                </div>
                            </div>
                            <div className="flex justify-between items-center text-sm">
                                <span className="font-bold text-slate-500">Tiền nước:</span>
                                <span className="font-black text-slate-800">{formatVND(invoice?.details.waterPrice)}</span>
                            </div>
                            {(() => {
                                const fees = invoice?.details?.otherFees || [];
                                if (Array.isArray(fees)) return fees.filter(f => f.amount > 0).map((f, i) => (
                                    <div key={i} className="flex justify-between items-center text-sm">
                                        <span className="font-bold text-slate-500">{f.name || 'Phí khác'}:</span>
                                        <span className="font-black text-slate-800">{formatVND(f.amount)}</span>
                                    </div>
                                ));
                                return Object.entries(fees).map(([k, v]) => v > 0 && (
                                    <div key={k} className="flex justify-between items-center text-sm">
                                        <span className="font-bold text-slate-500">{k === 'internet' ? 'Internet' : k === 'waste' ? 'Rác/Vệ sinh' : k}:</span>
                                        <span className="font-black text-slate-800">{formatVND(v)}</span>
                                    </div>
                                ));
                            })()}
                        </div>

                        <div className="mb-6 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                            <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 text-center">Biểu đồ tiêu thụ điện năng (kWh)</p>
                            <BillChart roomId={invoice?.roomId} currentMonth={invoice?.month} />
                        </div>

                        <div className="bg-slate-900 p-5 rounded-[1.5rem] flex justify-between items-center text-white mb-8 shadow-md">
                            <span className="text-[10px] font-black uppercase tracking-widest opacity-60">Tổng cộng thanh toán</span>
                            <span className="text-2xl font-black text-emerald-400">{formatVND(invoice?.total)}</span>
                        </div>

                        {qrSrc && (
                            <div className="text-center space-y-4">
                                <div className="inline-block p-4 bg-slate-50 rounded-[2.5rem] border border-slate-100">
                                    <QRImage src={qrSrc} onReady={(val) => { setQrB64(val); setQrReady(!!val); }} />
                                </div>
                                <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest leading-loose">
                                    <p className="text-slate-900 text-sm">{settings.bankName} - {settings.bankAcc}</p>
                                    <p>{settings.ownerName}</p>
                                </div>
                            </div>
                        )}
                        <div className="mt-6 pt-5 border-t border-dashed border-slate-200 text-center">
                            <p className="text-[11px] text-slate-400 font-bold italic leading-6">Cảm ơn bạn đã đồng hành,</p>
                            <p className="text-[11px] text-slate-400 font-bold italic">trân trọng sự hợp tác của chúng ta 🤝</p>
                        </div>
                    </div>

                    <div className="mt-8">
                        <button
                            onClick={handleCapture}
                            disabled={!qrReady || capturing}
                            className="w-full p-5 font-black rounded-[1.5rem] shadow-xl flex items-center justify-center gap-2 transition-all"
                            style={{background:(qrReady&&!capturing)?'#2563eb':'#93c5fd', color:'white', cursor:(qrReady&&!capturing)?'pointer':'not-allowed'}}
                        >
                            {capturing ? (
                                <><div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>Đang xuất ảnh...</>
                            ) : !qrReady ? (
                                <><div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>Đang tải QR...</>
                            ) : (
                                <><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>Tải ảnh hóa đơn</>
                            )}
                        </button>
                    </div>
                </Modal>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [fbUser, setFbUser] = useState(null);
            const [authReady, setAuthReady] = useState(false);
            const [pinHash, setPinHash] = useState(null);
            const [unlocked, setUnlocked] = useState(false);
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('sr_darkmode') === 'true');
            const [viewingUid, setViewingUid] = useState(null);
            const [allUsers, setAllUsers] = useState([]);

            const [houses, setHouses] = useState([]);
            const [rooms, setRooms] = useState([]);
            const [bills, setBills] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [paymentLogs, setPaymentLogs] = useState([]); // sổ thu tiền từng phần
            const [settings, setSettings] = useState({bankName:'', bankAcc:'', ownerName:''});
            const [activeTab, setActiveTab] = useState('dashboard');
            const [currentMonth, setCurrentMonth] = useState(getMonthStr());
            const [modals, setModals] = useState({ house: null, room: null, bill: null, expense: null, invoice: null, paymentLog: null });
            const [syncStatus, setSyncStatus] = useState('connecting');
            const [searchDash, setSearchDash] = useState('');
            const [searchMgmt, setSearchMgmt] = useState('');
            const [searchBill, setSearchBill] = useState('');
            const [openHouses, setOpenHouses] = useState({});
            const [openBillHouses, setOpenBillHouses] = useState({});
            const toggleHouse = (id) => setOpenHouses(prev => ({...prev, [id]: !prev[id]}));
            const toggleBillHouse = (id) => setOpenBillHouses(prev => ({...prev, [id]: !prev[id]}));
            const dataLoaded = useRef(false);
            const syncTimer = useRef(null);

            const activeUid = useMemo(() => viewingUid || fbUser?.uid, [viewingUid, fbUser?.uid]);
            const isAdmin = fbUser?.uid === ADMIN_UID;

            const syncEnabled = unlocked && !!activeUid;
            const { data: fbData, synced, pushData } = useFirebaseSync(syncEnabled ? activeUid : null);

            const [isFirstLogin, setIsFirstLogin] = useState(false);
            const [showChangePw, setShowChangePw] = useState(false);
            const [showChangePin, setShowChangePin] = useState(false);

            useEffect(() => {
                const unsub = window._fbAuth.onAuthStateChanged((user) => {
                    setFbUser(user);
                    setAuthReady(true);
                    if (user) {
                        const created = new Date(user.metadata.creationTime).getTime();
                        const lastSignIn = new Date(user.metadata.lastSignInTime).getTime();
                        const isFirst = (lastSignIn - created) < 5000;
                        setIsFirstLogin(isFirst);
                        window._fbDb.ref(`users/${user.uid}/profile`).set({
                            email: user.email,
                            uid: user.uid,
                            lastLogin: new Date().toISOString()
                        });
                        const pinKey = getPinKey(user.uid);
                        const savedPin = localStorage.getItem(pinKey);
                        const unlockedKey = getUnlockedKey(user.uid);
                        const wasUnlocked = localStorage.getItem(unlockedKey) === '1';
                        setPinHash(savedPin);
                        setUnlocked(wasUnlocked && !!savedPin);
                    } else {
                        setPinHash(null);
                        setUnlocked(false);
                        setIsFirstLogin(false);
                        dataLoaded.current = false;
                    }
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
                localStorage.setItem('sr_darkmode', darkMode);
            }, [darkMode]);

            useEffect(() => {
                if (!synced || dataLoaded.current) return;
                dataLoaded.current = true;
                if (fbData) {
                    setHouses(fbData.houses || []);
                    setRooms(fbData.rooms || []);
                    setBills(fbData.bills || []);
                    setExpenses(fbData.expenses || []);
                    setSettings(fbData.settings || {bankName:'', bankAcc:'', ownerName:''});
                    setPaymentLogs(fbData.paymentLogs || []);
                    console.log('✅ Data loaded from Firebase:', Object.keys(fbData));
                } else {
                    setHouses([]); setRooms([]); setBills([]); setExpenses([]); setPaymentLogs([]);
                    setSettings({bankName:'', bankAcc:'', ownerName:''});
                    console.log('ℹ️ New user, starting fresh');
                }
                setSyncStatus('ok');
            }, [synced, fbData]);

            useEffect(() => {
                if (!viewingUid) return;
                dataLoaded.current = false;
                setHouses([]); setRooms([]); setBills([]); setExpenses([]); setPaymentLogs([]);
                setSettings({bankName:'', bankAcc:'', ownerName:''});
                setSyncStatus('connecting');
            }, [viewingUid]);

            useEffect(() => {
                if (!unlocked || !dataLoaded.current || !activeUid) return;
                clearTimeout(syncTimer.current);
                syncTimer.current = setTimeout(() => {
                    setSyncStatus('connecting');
                    pushData(activeUid, { houses, rooms, bills, expenses, settings, paymentLogs });
                    setTimeout(() => setSyncStatus('ok'), 800);
                }, 1200);
            }, [houses, rooms, bills, expenses, settings, paymentLogs, activeUid]);

            useEffect(() => {
                if (!unlocked) return;
                const cur = expenses.filter(e => e.month === currentMonth);
                if (cur.length === 0) {
                    const lastMonth = new Date(currentMonth + '-01');
                    lastMonth.setMonth(lastMonth.getMonth() - 1);
                    const prev = expenses.filter(e => e.month === getMonthStr(lastMonth));
                    if (prev.length > 0) {
                        setExpenses(p => {
                            if (p.filter(e => e.month === currentMonth).length > 0) return p;
                            return [...p, ...prev.map(e => ({...e, id: generateID(), month: currentMonth}))];
                        });
                    }
                }
            }, [currentMonth, unlocked]);

            useEffect(() => {
                if (!isAdmin || !unlocked) return;
                const ref = window._fbDb.ref('users');
                ref.on('value', snap => {
                    const val = snap.val() || {};
                    const list = Object.entries(val)
                        .filter(([uid]) => uid !== ADMIN_UID)
                        .map(([uid, d]) => ({
                            uid,
                            email: d.profile?.email || uid.slice(0,10) + '...',
                            lastLogin: d.profile?.lastLogin || '',
                            houses: (d.data?.houses || []).length,
                            rooms: (d.data?.rooms || []).length,
                        }));
                    setAllUsers(list);
                });
                return () => ref.off('value');
            }, [isAdmin, unlocked]);

            const handleLogin = (user) => {};
            const handleSetupPin = async (hash) => {
                const pinKey = getPinKey(fbUser.uid);
                const unlockedKey = getUnlockedKey(fbUser.uid);
                localStorage.setItem(pinKey, hash);
                localStorage.setItem(unlockedKey, '1');
                setPinHash(hash);
                setUnlocked(true);
            };
            const handleUnlock = () => {
                const unlockedKey = getUnlockedKey(fbUser.uid);
                localStorage.setItem(unlockedKey, '1');
                setUnlocked(true);
            };
            const handleLogout = async () => {
                if (fbUser) {
                    localStorage.removeItem(getUnlockedKey(fbUser.uid));
                }
                await window._fbAuth.signOut();
                setUnlocked(false);
                setViewingUid(null);
                dataLoaded.current = false;
            };

            // --- MODAL ĐỔI MẬT KHẨU ---
            const ChangePwModal = () => {
                const [step, setStep] = useState(1);
                const [newPw, setNewPw] = useState('');
                const [confirmPw, setConfirmPw] = useState('');
                const [loading, setLoading] = useState(false);
                const [error, setError] = useState('');
                const [showNew, setShowNew] = useState(false);

                const handleChange = async () => {
                    if (newPw.length < 6) return setError('Mật khẩu tối thiểu 6 ký tự');
                    if (newPw !== confirmPw) return setError('Mật khẩu xác nhận không khớp!');
                    setLoading(true); setError('');
                    try {
                        await fbUser.updatePassword(newPw);
                        setStep(2);
                        setTimeout(() => { setShowChangePw(false); setIsFirstLogin(false); }, 1500);
                    } catch(e) {
                        if (e.code === 'auth/requires-recent-login') {
                            setError('Phiên đăng nhập quá cũ, vui lòng đăng xuất và đăng nhập lại');
                        } else {
                            setError('Có lỗi xảy ra: ' + e.message);
                        }
                        setLoading(false);
                    }
                };

                return (
                    <Modal isOpen={showChangePw} onClose={() => { setShowChangePw(false); setIsFirstLogin(false); }} title="Đổi mật khẩu">
                        {step === 2 ? (
                            <div className="text-center py-8 space-y-3">
                                <div className="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto">
                                    <svg className="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>
                                </div>
                                <p className="font-black text-lg" style={{color:'var(--text)'}}>Đổi mật khẩu thành công!</p>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <div className="p-4 rounded-2xl bg-blue-50 border border-blue-100">
                                    <p className="text-xs font-bold text-blue-600">💡 Bạn đang đăng nhập với tài khoản do admin cấp. Hãy đổi mật khẩu cá nhân để bảo mật hơn.</p>
                                </div>
                                <div>
                                    <label className="text-[10px] font-black uppercase tracking-widest mb-1 block" style={{color:'var(--text3)'}}>Mật khẩu mới</label>
                                    <div className="relative">
                                        <input type={showNew ? 'text' : 'password'} value={newPw} onChange={e=>setNewPw(e.target.value)}
                                            placeholder="Tối thiểu 6 ký tự"
                                            className="w-full p-4 rounded-2xl border-2 border-transparent outline-none font-bold focus:border-blue-500 pr-12"
                                            style={{background:'var(--input-bg)', color:'var(--text)'}}/>
                                        <button onClick={()=>setShowNew(!showNew)} className="absolute right-4 top-1/2 -translate-y-1/2" style={{color:'var(--text3)'}}>
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[10px] font-black uppercase tracking-widest mb-1 block" style={{color:'var(--text3)'}}>Xác nhận mật khẩu</label>
                                    <input type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)}
                                        placeholder="Nhập lại mật khẩu mới"
                                        className="w-full p-4 rounded-2xl border-2 border-transparent outline-none font-bold focus:border-blue-500"
                                        style={{background:'var(--input-bg)', color:'var(--text)'}}/>
                                </div>
                                {error && <p className="text-red-400 text-xs font-bold">{error}</p>}
                                <button onClick={handleChange} disabled={loading}
                                    className="w-full p-4 rounded-2xl font-black text-white flex items-center justify-center gap-2"
                                    style={{background: loading ? '#93c5fd' : '#2563eb'}}>
                                    {loading ? <><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>Đang đổi...</> : 'Đổi mật khẩu'}
                                </button>
                            </div>
                        )}
                    </Modal>
                );
            };

            // --- MODAL ĐỔI PIN ---
            const ChangePinModal = () => {
                const [step, setStep] = useState('verify');
                const [digits, setDigits] = useState([]);
                const [newPinHash, setNewPinHash] = useState('');
                const [status, setStatus] = useState('idle');

                const handleKey = async (k) => {
                    if (status !== 'idle') return;
                    if (k === 'del') { setDigits(d => d.slice(0,-1)); return; }
                    const next = [...digits, k];
                    setDigits(next);
                    if (next.length === 4) {
                        const h = await hashPIN(next.join(''));
                        if (step === 'verify') {
                            if (h === pinHash) {
                                setStatus('success');
                                setTimeout(() => { setDigits([]); setStep('newpin'); setStatus('idle'); }, 400);
                            } else {
                                setStatus('error');
                                setTimeout(() => { setDigits([]); setStatus('idle'); }, 600);
                            }
                        } else if (step === 'newpin') {
                            setNewPinHash(h);
                            setStatus('success');
                            setTimeout(() => { setDigits([]); setStep('confirm'); setStatus('idle'); }, 400);
                        } else if (step === 'confirm') {
                            if (h === newPinHash) {
                                const pinKey = getPinKey(fbUser.uid);
                                localStorage.setItem(pinKey, newPinHash);
                                setPinHash(newPinHash);
                                setStatus('success');
                                setStep('done');
                                setTimeout(() => setShowChangePin(false), 1200);
                            } else {
                                setStatus('error');
                                setTimeout(() => { setDigits([]); setStatus('idle'); setStep('newpin'); setNewPinHash(''); }, 600);
                            }
                        }
                    }
                };

                const stepLabel = { verify: 'Nhập PIN hiện tại', newpin: 'Nhập PIN mới', confirm: 'Xác nhận PIN mới', done: 'Đổi PIN thành công!' };
                const keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
                return (
                    <Modal isOpen={showChangePin} onClose={() => setShowChangePin(false)} title="Đổi mã PIN">
                        {step === 'done' ? (
                            <div className="text-center py-8 space-y-3">
                                <div className="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto">
                                    <svg className="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>
                                </div>
                                <p className="font-black text-lg" style={{color:'var(--text)'}}>Đổi PIN thành công!</p>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center gap-8 py-4">
                                <p className="font-black text-sm" style={{color:'var(--text)'}}>{stepLabel[step]}</p>
                                <div className={`flex gap-4 ${status==='error' ? 'pin-shake' : ''} ${status==='success' ? 'pin-success' : ''}`}>
                                    {[0,1,2,3].map(i => (
                                        <div key={i} className={`pin-dot ${digits.length > i ? 'filled' : ''} ${status==='error' ? '!border-red-400 !bg-red-400' : ''} ${status==='success' ? '!border-emerald-500 !bg-emerald-500' : ''}`}></div>
                                    ))}
                                </div>
                                <div className="grid grid-cols-3 gap-3 w-full">
                                    {keys.map((k,i) => k==='' ? <div key={i}/> : (
                                        <button key={i} onClick={()=>handleKey(k)}
                                            className="pin-key h-14 rounded-2xl font-black text-xl flex items-center justify-center border"
                                            style={{background:'var(--surface)', borderColor:'var(--border)', color: k==='del'?'#f87171':'var(--text)'}}>
                                            {k==='del' ? <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"/></svg> : k}
                                        </button>
                                    ))}
                                </div>
                                {status === 'error' && <p className="text-red-400 font-bold text-sm">Không đúng, thử lại!</p>}
                            </div>
                        )}
                    </Modal>
                );
            };

            const renderAdmin = () => (
                <div className="space-y-6 animate-fade-in pb-20">
                    <div>
                        <h2 className="text-2xl font-black tracking-tighter" style={{color:'var(--text)'}}>Admin</h2>
                        <p className="text-xs font-bold" style={{color:'var(--text3)'}}>Quản lý tài khoản người dùng</p>
                    </div>
                    <div className="p-4 rounded-2xl border" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                        <p className="text-[9px] font-black uppercase tracking-widest mb-1" style={{color:'var(--text3)'}}>Đang đăng nhập</p>
                        <p className="font-black text-sm" style={{color:'var(--text)'}}>{fbUser?.email}</p>
                        <p className="text-[10px] font-bold text-amber-500">👑 Admin</p>
                    </div>
                    <div className="space-y-3">
                        <p className="text-[9px] font-black uppercase tracking-widest" style={{color:'var(--text3)'}}>
                            Người dùng ({allUsers.length})
                        </p>
                        {allUsers.length === 0 && (
                            <div className="text-center py-10 space-y-2">
                                <p className="text-2xl">👥</p>
                                <p className="text-sm font-bold" style={{color:'var(--text3)'}}>Chưa có user nào đăng nhập</p>
                                <p className="text-xs" style={{color:'var(--text3)'}}>User sẽ xuất hiện sau khi họ đăng nhập lần đầu</p>
                            </div>
                        )}
                        {allUsers.map(u => (
                            <div key={u.uid} className="p-4 rounded-2xl border" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                                <div className="flex justify-between items-start mb-3">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center font-black text-blue-600 text-sm">
                                            {u.email[0].toUpperCase()}
                                        </div>
                                        <div>
                                            <p className="font-black text-sm" style={{color:'var(--text)'}}>{u.email}</p>
                                            <p className="text-[10px]" style={{color:'var(--text3)'}}>{u.houses} nhà · {u.rooms} phòng</p>
                                            {u.lastLogin && (
                                                <p className="text-[9px]" style={{color:'var(--text3)'}}>Login: {new Date(u.lastLogin).toLocaleDateString('vi-VN')}</p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-3 gap-2">
                                    <button onClick={() => { dataLoaded.current = false; setViewingUid(u.uid); setActiveTab('dashboard'); }} className="py-2 rounded-xl text-xs font-black text-blue-600 bg-blue-50 text-center">📊 Tổng quan</button>
                                    <button onClick={() => { dataLoaded.current = false; setViewingUid(u.uid); setActiveTab('manage'); }} className="py-2 rounded-xl text-xs font-black text-emerald-600 bg-emerald-50 text-center">🏠 Phòng</button>
                                    <button onClick={() => { dataLoaded.current = false; setViewingUid(u.uid); setActiveTab('bills'); }} className="py-2 rounded-xl text-xs font-black text-purple-600 bg-purple-50 text-center">🧾 HĐ</button>
                                </div>
                            </div>
                        ))}
                    </div>
                    <button onClick={handleLogout} className="w-full p-4 rounded-2xl text-red-400 font-black text-sm border border-red-100 bg-red-50">Đăng xuất</button>
                </div>
            );

            // --- AUTH FLOW ---
            if (!authReady) return (
                <div className="fixed inset-0 flex items-center justify-center" style={{background:'var(--bg)'}}>
                    <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
            );
            if (!fbUser) return <LoginScreen onLogin={handleLogin} />;
            if (!pinHash) return <PinScreen mode="setup" onSuccess={handleSetupPin} onLogout={handleLogout} />;
            if (!unlocked) return <PinScreen mode="unlock" storedHash={pinHash} onSuccess={handleUnlock} onLogout={handleLogout} />;
            if (!synced) return (
                <div className="fixed inset-0 flex flex-col items-center justify-center gap-4" style={{background:'var(--bg)'}}>
                    <div className="w-16 h-16 bg-blue-600 rounded-3xl flex items-center justify-center shadow-xl animate-pulse">
                        <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    </div>
                    <p className="font-black text-sm" style={{color:'var(--text)'}}>Đang tải dữ liệu...</p>
                    <p className="text-xs font-bold" style={{color:'var(--text3)'}}>Kết nối Firebase 🔥</p>
                </div>
            );

            // THỐNG KÊ
            const dashboardData = (() => {
                const monthBills = bills.filter(b => b.month === currentMonth);
                const monthExps = expenses.filter(e => e.month === currentMonth);
                const duThu = monthBills.reduce((s, b) => s + b.total, 0);
                // daThu = tổng tiền THỰC thu (paidAmount nếu có, hoặc total nếu paid=true)
                const daThu = monthBills.reduce((s, b) => {
                    if (b.paid) return s + b.total;
                    if (b.paidAmount > 0) return s + b.paidAmount;
                    return s;
                }, 0);
                const tongChi = monthExps.reduce((s, e) => s + e.amount, 0);
                return { duThu, daThu, tongChi, loiNhuan: daThu - tongChi };
            })();

            // --- RENDER DASHBOARD ---
            const renderDashboard = () => {
                const filteredHouses = houses.filter(h =>
                    removeAccents(h.name.toLowerCase()).includes(removeAccents(searchDash.toLowerCase()))
                );
                return (
                <div className="space-y-6 animate-fade-in pb-10">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-black tracking-tighter" style={{color:'var(--text)'}}>Tổng quan</h2>
                        <div className="flex p-1 rounded-xl shadow-sm border" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                            <button onClick={() => { let d = new Date(currentMonth+'-01'); d.setMonth(d.getMonth()-1); setCurrentMonth(getMonthStr(d)); }} className="p-1" style={{color:'var(--text3)'}}><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/></svg></button>
                            <span className="px-3 py-1 font-bold text-xs uppercase self-center" style={{color:'var(--text)'}}>{currentMonth}</span>
                            <button onClick={() => { let d = new Date(currentMonth+'-01'); d.setMonth(d.getMonth()+1); setCurrentMonth(getMonthStr(d)); }} className="p-1" style={{color:'var(--text3)'}}><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg></button>
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                        <div className="p-4 rounded-3xl border shadow-sm" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                            <p className="text-[9px] font-black uppercase tracking-widest mb-1" style={{color:'var(--text3)'}}>Dự thu</p>
                            <p className="text-lg font-black" style={{color:'var(--text)'}}>{formatVND(dashboardData.duThu)}</p>
                        </div>
                        <div className="p-4 bg-blue-600 rounded-3xl text-white" style={{boxShadow: '0 8px 24px rgba(37,99,235,0.45)'}}>
                            <p className="text-[9px] font-black text-blue-100 uppercase tracking-widest mb-1">Đã thu</p>
                            <p className="text-lg font-black">{formatVND(dashboardData.daThu)}</p>
                        </div>
                        <div className="p-4 rounded-3xl border shadow-sm" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                            <p className="text-[9px] font-black uppercase tracking-widest mb-1" style={{color:'var(--text3)'}}>Tổng chi</p>
                            <p className="text-lg font-black text-red-500">{formatVND(dashboardData.tongChi)}</p>
                        </div>
                        <div className="p-4 bg-emerald-500 rounded-3xl text-white" style={{boxShadow: '0 8px 24px rgba(16,185,129,0.45)'}}>
                            <p className="text-[9px] font-black text-emerald-100 uppercase tracking-widest mb-1">Lợi nhuận</p>
