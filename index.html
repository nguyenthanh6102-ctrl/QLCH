                            <p className="text-lg font-black">{formatVND(dashboardData.loiNhuan)}</p>
                        </div>
                    </div>
                    <div className="relative">
                        <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4" style={{color:'var(--text3)'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/></svg>
                        <input value={searchDash} onChange={e => setSearchDash(e.target.value)} placeholder="Tìm nhà..." className="w-full pl-11 pr-4 py-3 rounded-2xl border-2 border-transparent outline-none font-bold text-sm focus:border-blue-500" style={{background:'var(--input-bg)', color:'var(--text)'}} />
                    </div>
                    {filteredHouses.length === 0 && <p className="text-center py-10 font-bold text-sm" style={{color:'var(--text3)'}}>Không tìm thấy nhà nào</p>}
                    <div className="space-y-3">
                        {filteredHouses.map(h => {
                            const hRooms = rooms.filter(r => r.houseId === h.id);
                            const hBills = bills.filter(b => hRooms.some(r => r.id === b.roomId) && b.month === currentMonth);
                            const allMonthExps = expenses.filter(e => e.month === currentMonth);
                            const hExpsWithId = allMonthExps.filter(e => e.houseId === h.id);
                            const isFirstHouse = houses[0]?.id === h.id;
                            const hExps = hExpsWithId.length > 0 ? hExpsWithId : 
                                (isFirstHouse ? allMonthExps.filter(e => !e.houseId) : []);
                            const hDuThu = hBills.reduce((s,b) => s+b.total, 0);
                            const hDaThu = hBills.reduce((s,b) => {
                                if (b.paid) return s + b.total;
                                if (b.paidAmount > 0) return s + b.paidAmount;
                                return s;
                            }, 0);
                            const hChi = hExps.reduce((s,e) => s+e.amount, 0);
                            const hLai = hDaThu - hChi;
                            const isOpen = !!openHouses[h.id];
                            return (
                                <div key={h.id} className="rounded-[2rem] border overflow-hidden shadow-sm" style={{borderColor:'var(--border)'}}>
                                    <button onClick={() => toggleHouse(h.id)} className="w-full p-5 flex justify-between items-center transition-all" style={{background:'var(--surface)'}}>
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
                                                <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                                            </div>
                                            <div className="text-left">
                                                <p className="font-black text-sm" style={{color:'var(--text)'}}>{h.name}</p>
                                                <p className="text-[10px] font-bold" style={{color:'var(--text3)'}}>{hRooms.length} phòng · {hBills.length}/{hRooms.length} HĐ</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <span className={`text-xs font-black ${hLai >= 0 ? 'text-emerald-500' : 'text-red-400'}`}>{formatVND(hDaThu)}</span>
                                            <svg className={`w-4 h-4 transition-transform ${isOpen ? 'rotate-180' : ''}`} style={{color:'var(--text3)'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>
                                        </div>
                                    </button>
                                    {isOpen && (
                                        <div className="border-t animate-fade-in" style={{borderColor:'var(--border)', background:'var(--surface2)'}}>
                                            <div className="p-4 grid grid-cols-2 gap-2">
                                                <div className="p-3 rounded-2xl border" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                                                    <p className="text-[8px] font-black uppercase tracking-widest mb-1" style={{color:'var(--text3)'}}>Dự thu</p>
                                                    <p className="text-sm font-black" style={{color:'var(--text)'}}>{formatVND(hDuThu)}</p>
                                                </div>
                                                <div className="p-3 rounded-2xl bg-blue-600 text-white" style={{boxShadow:'0 6px 16px rgba(37,99,235,0.4)'}}>
                                                    <p className="text-[8px] font-black text-blue-100 uppercase tracking-widest mb-1">Đã thu</p>
                                                    <p className="text-sm font-black">{formatVND(hDaThu)}</p>
                                                </div>
                                                <div className="p-3 rounded-2xl border" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                                                    <p className="text-[8px] font-black uppercase tracking-widest mb-1" style={{color:'var(--text3)'}}>Tổng chi</p>
                                                    <p className="text-sm font-black text-red-500">{formatVND(hChi)}</p>
                                                </div>
                                                <div className={`p-3 rounded-2xl text-white`} style={{background: hLai >= 0 ? '#10b981' : '#f87171', boxShadow: hLai >= 0 ? '0 6px 16px rgba(16,185,129,0.4)' : '0 6px 16px rgba(248,113,113,0.4)'}}>
                                                    <p className="text-[8px] font-black uppercase tracking-widest mb-1 opacity-80">Lợi nhuận</p>
                                                    <p className="text-sm font-black">{formatVND(hLai)}</p>
                                                </div>
                                            </div>
                                            <div className="px-4 pb-2">
                                                <p className="text-[9px] font-black uppercase tracking-widest mb-2" style={{color:'var(--text3)'}}>Trạng thái hóa đơn</p>
                                                <div className="space-y-2">
                                                    {hRooms.map(r => {
                                                        const bill = hBills.find(b => b.roomId === r.id);
                                                        if (!bill) return (
                                                            <div key={r.id} className="p-3 rounded-2xl flex justify-between items-center border" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                                                                <div className="flex items-center gap-3">
                                                                    <div className="w-8 h-8 rounded-xl flex items-center justify-center font-black text-xs bg-slate-100 text-slate-400">{r.name}</div>
                                                                    <div>
                                                                        <p className="text-xs font-bold" style={{color:'var(--text)'}}>{r.occupants || 'Phòng trống'}</p>
                                                                        <p className="text-[10px]" style={{color:'var(--text3)'}}>Chưa tạo HĐ</p>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                        // Tính trạng thái thanh toán
                                                        const paidAmt = bill.paidAmount || 0;
                                                        const isFullPaid = bill.paid;
                                                        const isPartial = !isFullPaid && paidAmt > 0;
                                                        const debtAmt = bill.total - paidAmt;
                                                        const logs = paymentLogs.filter(l => l.billId === bill.id).sort((a,b) => b.createdAt - a.createdAt);
                                                        const lastLog = logs[0];
                                                        const isOverdue = lastLog?.dueDate && !isFullPaid && new Date(lastLog.dueDate) < new Date();

                                                        return (
                                                            <div key={r.id} className="rounded-2xl border overflow-hidden" style={{background:'var(--surface)', borderColor: isOverdue ? '#fca5a5' : 'var(--border)'}}>
                                                                {/* Row chính */}
                                                                <div className="p-3 flex justify-between items-center">
                                                                    <div onClick={() => setModals({...modals, invoice: bill})} className="flex items-center gap-3 flex-1 cursor-pointer">
                                                                        <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-black text-xs flex-shrink-0
                                                                            ${isFullPaid ? 'bg-emerald-100 text-emerald-600' : isPartial ? 'bg-amber-100 text-amber-600' : 'bg-blue-100 text-blue-500'}`}>
                                                                            {r.name}
                                                                        </div>
                                                                        <div className="min-w-0">
                                                                            <p className="text-xs font-bold truncate" style={{color:'var(--text)'}}>{r.occupants || 'Phòng trống'}</p>
                                                                            <p className="text-[10px]" style={{color:'var(--text3)'}}>
                                                                                {isPartial
                                                                                    ? <span>Đã thu <span className="text-amber-500 font-black">{formatVND(paidAmt)}</span> · Nợ <span className="text-red-400 font-black">{formatVND(debtAmt)}</span></span>
                                                                                    : formatVND(bill.total)
                                                                                }
                                                                            </p>
                                                                        </div>
                                                                    </div>
                                                                    <div className="flex items-center gap-1 flex-shrink-0 ml-2">
                                                                        {/* Nút sổ thu */}
                                                                        <button onClick={e => { e.stopPropagation(); setModals({...modals, paymentLog: bill}); }}
                                                                            className={`p-1.5 rounded-xl relative ${isOverdue ? 'bg-red-50' : 'bg-slate-50'}`}
                                                                            title="Sổ thu tiền">
                                                                            <svg className={`w-4 h-4 ${isOverdue ? 'text-red-400' : 'text-slate-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                                                                            </svg>
                                                                            {(isPartial || isOverdue) && <span className="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-red-400"></span>}
                                                                        </button>
                                                                        {/* Nút Đã thu / Chưa thu */}
                                                                        <button onClick={e => { e.stopPropagation(); setBills(bills.map(b => b.id===bill.id ? {...b, paid:!b.paid, paidAmount: !b.paid ? b.total : 0} : b)); }}
                                                                            className={`px-2 py-1 rounded-full text-[9px] font-black uppercase tracking-widest
                                                                            ${isFullPaid ? 'bg-emerald-500 text-white' : isPartial ? 'bg-amber-400 text-white' : 'bg-slate-100 text-slate-400'}`}>
                                                                            {isFullPaid ? 'Đã thu' : isPartial ? 'Một phần' : 'Chưa thu'}
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                                {/* Badge quá hạn */}
                                                                {isOverdue && (
                                                                    <div className="px-3 pb-2">
                                                                        <p className="text-[9px] font-black text-red-400 bg-red-50 px-2 py-1 rounded-lg">
                                                                            ⚠️ Quá hạn hẹn {new Date(lastLog.dueDate).toLocaleDateString('vi-VN')} · Còn nợ {formatVND(debtAmt)}
                                                                        </p>
                                                                    </div>
                                                                )}
                                                                {/* Input nhập tiền đã thu — hiện khi chưa thu đủ */}
                                                                {!isFullPaid && (
                                                                    <div className="px-3 pb-3 border-t pt-2" style={{borderColor:'var(--border)'}}>
                                                                        <p className="text-[9px] font-black uppercase tracking-widest mb-1" style={{color:'var(--text3)'}}>Tiền đã thu</p>
                                                                        <div className="flex gap-2 items-center">
                                                                            <input
                                                                                type="text"
                                                                                value={formatNum(bill.paidAmount || 0)}
                                                                                onChange={e => {
                                                                                    const val = parseNum(e.target.value);
                                                                                    setBills(bills.map(b => b.id===bill.id ? {...b, paidAmount: Math.min(val, b.total)} : b));
                                                                                }}
                                                                                onClick={e => e.stopPropagation()}
                                                                                placeholder="0"
                                                                                className="flex-1 p-2 rounded-xl text-xs font-black border-2 border-transparent focus:border-blue-400 outline-none"
                                                                                style={{background:'var(--input-bg)', color:'var(--text)'}}
                                                                            />
                                                                            <span className="text-[10px] font-bold" style={{color:'var(--text3)'}}>/ {formatVND(bill.total)}</span>
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                            <div className="px-4 pb-4 mt-3">
                                                <div className="flex justify-between items-center mb-2">
                                                    <p className="text-[9px] font-black uppercase tracking-widest" style={{color:'var(--text3)'}}>Chi phí vận hành</p>
                                                    <button onClick={() => setModals({...modals, expense: { name: '', amount: 0, houseId: h.id }})} className="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-full">+ Thêm</button>
                                                </div>
                                                {hExps.length === 0 && <p className="text-center py-3 text-xs font-bold" style={{color:'var(--text3)'}}>Không có chi phí</p>}

                                                    {hExps.map(exp => (
                                                        <div key={exp.id} onClick={() => setModals({...modals, expense: exp})} className="flex justify-between items-center p-3 rounded-2xl border cursor-pointer" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                                                            <span className="text-xs font-bold" style={{color:'var(--text)'}}>{exp.name}</span>
                                                            <span className="text-xs font-black text-red-500">{formatVND(exp.amount)}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                    {houses.length === 0 && <p className="text-center py-10 font-bold text-sm" style={{color:'var(--text3)'}}>Hãy thêm nhà để bắt đầu</p>}
                </div>
                );
            };

            // --- RENDER BILL TAB ---
            const renderBillTab = () => {
                const filteredHouses = houses.filter(h =>
                    removeAccents(h.name.toLowerCase()).includes(removeAccents(searchBill.toLowerCase()))
                );
                return (
                <div className="space-y-4 animate-fade-in pb-10">
                    <h2 className="text-2xl font-black tracking-tighter" style={{color:'var(--text)'}}>Lập hóa đơn</h2>
                    <div className="relative">
                        <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4" style={{color:'var(--text3)'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/></svg>
                        <input value={searchBill} onChange={e => setSearchBill(e.target.value)} placeholder="Tìm nhà..." className="w-full pl-11 pr-4 py-3 rounded-2xl border-2 border-transparent outline-none font-bold text-sm focus:border-blue-500" style={{background:'var(--input-bg)', color:'var(--text)'}} />
                    </div>
                    <div className="space-y-3">
                        {filteredHouses.map(h => {
                            const hRooms = rooms.filter(r => r.houseId === h.id);
                            const hBills = bills.filter(b => hRooms.some(r => r.id === b.roomId) && b.month === currentMonth);
                            const done = hBills.length;
                            const total = hRooms.length;
                            const isOpen = !!openBillHouses[h.id];
                            return (
                                <div key={h.id} className="rounded-[2rem] border overflow-hidden shadow-sm" style={{borderColor:'var(--border)'}}>
                                    <button onClick={() => toggleBillHouse(h.id)} className="w-full p-5 flex justify-between items-center" style={{background:'var(--surface)'}}>
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
                                                <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                                            </div>
                                            <div className="text-left">
                                                <p className="font-black text-sm" style={{color:'var(--text)'}}>{h.name}</p>
                                                <p className="text-[10px] font-bold" style={{color:'var(--text3)'}}>{done}/{total} phòng đã chốt</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className={`text-[10px] font-black px-2 py-1 rounded-full ${done === total && total > 0 ? 'bg-emerald-100 text-emerald-600' : 'bg-blue-50 text-blue-500'}`}>
                                                {done === total && total > 0 ? '✓ Xong' : `Còn ${total - done}`}
                                            </span>
                                            <svg className={`w-4 h-4 transition-transform ${isOpen ? 'rotate-180' : ''}`} style={{color:'var(--text3)'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>
                                        </div>
                                    </button>
                                    {isOpen && (
                                        <div className="border-t animate-fade-in space-y-3 p-4" style={{borderColor:'var(--border)', background:'var(--surface2)'}}>
                                            {hRooms.map(r => {
                                                const bill = bills.find(b => b.roomId === r.id && b.month === currentMonth);
                                                return (
                                                    <div key={r.id} className="p-4 rounded-[1.5rem] border shadow-sm flex justify-between items-center" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                                                        <div>
                                                            <p className="font-black text-sm" style={{color:'var(--text)'}}>Phòng {r.name}</p>
                                                            <p className="text-[10px] font-bold" style={{color:'var(--text3)'}}>{r.occupants || 'Phòng trống'} · Số điện: {r.currentElectric} kWh</p>
                                                        </div>
                                                        {bill ? (
                                                            <div className="flex gap-2">
                                                                <button onClick={() => setModals({...modals, invoice: bill})} className="p-3 bg-blue-50 text-blue-600 rounded-2xl">
                                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                                                </button>
                                                                <button onClick={() => { if(confirm("Xóa hóa đơn và chốt lại?")) { setRooms(rooms.map(rm => rm.id === r.id ? {...rm, currentElectric: bill.oldElectric} : rm)); setBills(bills.filter(b => b.id !== bill.id)); }}} className="p-3 bg-red-50 text-red-500 rounded-2xl">
                                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                                                </button>
                                                            </div>
                                                        ) : (
                                                            <button onClick={() => setModals({...modals, bill: { room: r, newElectric: r.currentElectric }})} className="px-5 py-3 bg-blue-600 text-white font-black text-[10px] uppercase tracking-widest rounded-2xl shadow-lg shadow-blue-100">Chốt số</button>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                            {hRooms.length === 0 && <p className="text-center py-4 text-xs font-bold" style={{color:'var(--text3)'}}>Chưa có phòng nào</p>}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                        {filteredHouses.length === 0 && <p className="text-center py-10 text-sm font-bold" style={{color:'var(--text3)'}}>Không tìm thấy nhà nào</p>}
                    </div>
                </div>
                );
            };

            // --- RENDER HISTORY ---
            const renderHistory = () => {
                const months = [...new Set(bills.concat(expenses).map(x => x.month))].sort((a,b) => b.localeCompare(a));
                return (
                    <div className="space-y-6 animate-fade-in pb-20">
                        <h2 className="text-2xl font-black text-slate-800 tracking-tighter">Lịch sử thu chi</h2>
                        {months.length === 0 && <p className="text-center py-10 text-slate-400 font-bold">Chưa có dữ liệu</p>}

                            {months.map(m => {
                                const mBills = bills.filter(b => b.month === m);
                                const mExps = expenses.filter(e => e.month === m);
                                const thu = mBills.reduce((s,b) => {
                                if (b.paid) return s + b.total;
                                if (b.paidAmount > 0) return s + b.paidAmount;
                                return s;
                            }, 0);
                                const chi = mExps.reduce((s,e) => s + e.amount, 0);
                                return (
                                    <div key={m} className="p-6 rounded-[2rem] border shadow-sm relative overflow-hidden group" style={{background: 'var(--surface)', borderColor: 'var(--border)'}}>

                                            <span className="text-xs font-black uppercase tracking-widest" style={{color: 'var(--text)'}}>Tháng {m}</span>
                                            <span className={`text-xs font-black uppercase ${thu - chi >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>Lãi: {formatVND(thu - chi)}</span>

                                                <p className="text-[10px] font-bold uppercase tracking-tighter mb-1 text-center" style={{color: 'var(--text3)'}}>Thu thực</p>
                                                <p className="text-lg font-black text-emerald-500 text-center">{formatVND(thu)}</p>
                                            </div>
                                            <div className="border-l" style={{borderColor: 'var(--border)'}}>
                                                <p className="text-[10px] font-bold uppercase tracking-tighter mb-1 text-center" style={{color: 'var(--text3)'}}>Chi phí</p>
                                                <p className="text-lg font-black text-red-500 text-center">{formatVND(chi)}</p>
                                            </div>
                                        </div>
                                        <div className="absolute right-0 top-0 w-24 h-24 rounded-bl-full -z-10 transition-all" style={{background: 'var(--surface2)'}}></div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            // --- RENDER MANAGEMENT ---
            const renderManagement = () => {
                const filteredHouses = houses.filter(h =>
                    removeAccents(h.name.toLowerCase()).includes(removeAccents(searchMgmt.toLowerCase()))
                );
                return (
                <div className="space-y-6 animate-fade-in pb-20">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-black tracking-tighter" style={{color:'var(--text)'}}>Quản lý Phòng</h2>
                        <button onClick={() => setModals({...modals, house: { name: '', address: '' }})} className="p-3 rounded-2xl shadow-xl text-xs font-bold" style={{background:'var(--text)', color:'var(--bg)'}}>+ Thêm Nhà</button>
                    </div>
                    <div className="relative">
                        <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4" style={{color:'var(--text3)'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/></svg>
                        <input value={searchMgmt} onChange={e => setSearchMgmt(e.target.value)} placeholder="Tìm nhà..." className="w-full pl-11 pr-4 py-3 rounded-2xl border-2 border-transparent outline-none font-bold text-sm focus:border-blue-500" style={{background:'var(--input-bg)', color:'var(--text)'}} />
                    </div>
                    {filteredHouses.length === 0 && <p className="text-center py-10 font-bold text-sm" style={{color:'var(--text3)'}}>Hãy thêm nhà để bắt đầu</p>}
                    {filteredHouses.map(h => (
                        <div key={h.id} className="p-6 rounded-[2rem] border shadow-sm" style={{background: 'var(--surface)', borderColor: 'var(--border)'}}>
                            <div className="flex justify-between items-start mb-6">
                                <div>
                                    <h4 className="text-xl font-black" style={{color: 'var(--text)'}}>{h.name}</h4>
                                    <p className="text-xs font-medium" style={{color: 'var(--text3)'}}>{h.address}</p>
                                </div>
                                <button onClick={() => setModals({...modals, house: h})} className="p-2 rounded-xl" style={{background: 'var(--surface2)', color: 'var(--text3)'}}><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg></button>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                {rooms.filter(r => r.houseId === h.id).map(r => (
                                    <div key={r.id} onClick={() => setModals({...modals, room: r})} className="p-4 rounded-[1.5rem] border-2 border-transparent transition-all cursor-pointer" style={{background: 'var(--surface2)'}}>
                                        <p className="text-[10px] font-black uppercase tracking-widest mb-1" style={{color: 'var(--text3)'}}>P.{r.name}</p>
                                        <p className="text-xs font-bold" style={{color: 'var(--text)'}}>{formatVND(r.rentPrice)}</p>
                                    </div>
                                ))}
                                <button onClick={() => setModals({...modals, room: { houseId: h.id, name: '', rentPrice: 0, electricityPrice: 3500, waterPrice: 0, otherFees: [], currentElectric: 0, occupants: '', numOccupants: 0 }})} className="p-4 bg-blue-50 border-2 border-dashed border-blue-200 rounded-[1.5rem] text-blue-500 font-black text-[10px] uppercase tracking-widest flex items-center justify-center">+ Thêm Phòng</button>
                            </div>
                        </div>
                    ))}
                </div>
                );
            };

            // --- CHART ---
            const customDataLabelsPlugin = {
                id: 'customDataLabels',
                afterDatasetsDraw(chart) {
                    const { ctx, data } = chart;
                    chart.getDatasetMeta(0).data.forEach((bar, index) => {
                        const value = data.datasets[0].data[index];
                        if (value !== null && value !== undefined) {
                            ctx.save();
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';
                            ctx.fillStyle = index === data.datasets[0].data.length - 1 ? '#2563eb' : '#64748b';
                            ctx.font = 'bold 10px "Plus Jakarta Sans", sans-serif';
                            ctx.fillText(value + ' kWh', bar.x, bar.y - 4);
                            ctx.restore();
                        }
                    });
                }
            };

            const BillChart = ({ roomId, currentMonth, newElectric }) => {
                const canvasRef = useRef(null);
                useEffect(() => {
                    if (!canvasRef.current) return;
                    const ctx = canvasRef.current.getContext('2d');
                    const history = bills.filter(b => b.roomId === roomId && b.month !== currentMonth).sort((a,b) => a.month.localeCompare(b.month)).slice(-3);
                    const labels = history.map(h => 'T.' + h.month.split('-')[1]);
                    const data = history.map(h => h.eUsed);
                    let currentLabel = currentMonth ? 'T.' + currentMonth.split('-')[1] : '';
                    if (newElectric !== undefined && currentMonth) {
                        const room = rooms.find(r => r.id === roomId);
                        if (room) {
                            const used = Math.max(0, newElectric - room.currentElectric);
                            labels.push(currentLabel);
                            data.push(used);
                        }
                    } else if (currentMonth) {
                        const existingBill = bills.find(b => b.roomId === roomId && b.month === currentMonth);
                        if (existingBill) {
                            labels.push(currentLabel);
                            data.push(existingBill.eUsed);
                        }
                    }
                    const maxVal = Math.max(...data, 1);
                    const isDark = document.documentElement.classList.contains('dark');
                    const barDefault = isDark ? '#334155' : '#e2e8f0';
                    const tickColor = isDark ? '#64748b' : '#94a3b8';
                    const chart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                data: data,
                                backgroundColor: data.map((_, i) => i === data.length - 1 ? '#3b82f6' : barDefault),
                                borderRadius: 6,
                                barThickness: 24
                            }]
                        },
                        plugins: [customDataLabelsPlugin],
                        options: {
                            responsive: true,
                            layout: { padding: { top: 20 } },
                            plugins: { legend: { display: false }, tooltip: { enabled: false } },
                            scales: { 
                                y: { display: false, suggestedMax: maxVal * 1.3 }, 
                                x: { grid: { display: false }, ticks: { font: { weight: 'bold', size: 10 }, color: tickColor } } 
                            }
                        }
                    });
                    return () => chart.destroy();
                }, [roomId, newElectric, currentMonth, bills, rooms]);
                return <canvas ref={canvasRef} height="120"></canvas>;
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col relative pb-32" style={{background: 'var(--bg)'}}>
                    {viewingUid && (
                        <div className="px-4 py-2 bg-amber-500 text-white text-center text-xs font-black flex justify-between items-center">
                            <span>👑 Đang xem: {allUsers.find(u=>u.uid===viewingUid)?.email || viewingUid.slice(0,8)}</span>
                            <button onClick={() => { setViewingUid(null); dataLoaded.current = false; setActiveTab('admin'); }} className="underline">← Thoát</button>
                        </div>
                    )}

                    <div className="px-6 py-8 flex justify-between items-center">
                        <div>
                            <h1 className="text-3xl font-black tracking-tighter" style={{color: 'var(--text)'}}>SmartRent <span className="text-blue-600">Pro</span></h1>
                            <p className="text-[10px] font-black uppercase tracking-widest" style={{color: 'var(--text3)'}}>
                                {isAdmin ? '👑 Admin' : fbUser?.email?.split('@')[0]}
                            </p>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setDarkMode(!darkMode)} className="theme-toggle w-12 h-12 rounded-2xl shadow-sm border flex items-center justify-center" style={{background: 'var(--surface)', borderColor: 'var(--border)'}}>
                                {darkMode ? (
                                    <svg className="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.166 17.834a.75.75 0 00-1.06 1.06l1.59 1.591a.75.75 0 001.061-1.06l-1.59-1.591zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.166 6.166a.75.75 0 001.06 1.06l1.591-1.59a.75.75 0 00-1.061-1.061L6.166 6.166z"/></svg>
                                ) : (
                                    <svg className="w-5 h-5 text-slate-600" fill="currentColor" viewBox="0 0 24 24"><path fillRule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z" clipRule="evenodd"/></svg>
                                )}
                            </button>
                            <div className="w-12 h-12 rounded-2xl shadow-sm border flex items-center justify-center" style={{background: 'var(--surface)', borderColor: 'var(--border)'}}>
                                {syncStatus === 'ok' && <div className="w-2 h-2 bg-emerald-500 rounded-full"></div>}
                                {syncStatus === 'connecting' && <div className="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>}
                                {syncStatus === 'error' && <div className="w-2 h-2 bg-red-400 rounded-full"></div>}
                            </div>
                        </div>
                    </div>

                    <main className="px-6 flex-1">
                        {activeTab === 'dashboard' && renderDashboard()}
                        {activeTab === 'bills' && renderBillTab()}
                        {activeTab === 'history' && renderHistory()}
                        {activeTab === 'manage' && renderManagement()}
                        {activeTab === 'admin' && isAdmin && renderAdmin()}
                        {activeTab === 'settings' && (
                            <div className="space-y-6 animate-fade-in pb-20">
                                <h2 className="text-2xl font-black tracking-tighter" style={{color:'var(--text)'}}>Cài đặt</h2>
                                <div className="p-4 rounded-2xl border" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                                    <p className="text-[9px] font-black uppercase tracking-widest mb-1" style={{color:'var(--text3)'}}>Tài khoản</p>
                                    <p className="font-black text-sm" style={{color:'var(--text)'}}>{fbUser?.email}</p>
                                </div>
                                <div className="p-6 rounded-[2rem] border space-y-2 shadow-sm" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                                    <p className="text-[9px] font-black uppercase tracking-widest mb-3" style={{color:'var(--text3)'}}>Thanh toán QR</p>
                                    <Input label="Họ tên chủ nhà" value={settings.ownerName} onChange={v => setSettings({...settings, ownerName: v})} />
                                    <Input label="Tên ngân hàng (Vietinbank, MB...)" value={settings.bankName} onChange={v => setSettings({...settings, bankName: v})} />
                                    <Input label="Số tài khoản" value={settings.bankAcc} onChange={v => setSettings({...settings, bankAcc: v})} />
                                </div>
                                <div className="rounded-2xl border overflow-hidden" style={{borderColor:'var(--border)'}}>
                                    <p className="text-[9px] font-black uppercase tracking-widest px-4 py-3" style={{color:'var(--text3)', background:'var(--surface2)'}}>Bảo mật</p>
                                    <button onClick={() => setShowChangePw(true)}
                                        className="w-full p-4 flex justify-between items-center border-b" style={{background:'var(--surface)', borderColor:'var(--border)'}}>
                                        <div className="flex items-center gap-3">
                                            <div className="w-9 h-9 bg-blue-50 rounded-xl flex items-center justify-center">
                                                <svg className="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                                            </div>
                                            <span className="font-bold text-sm" style={{color:'var(--text)'}}>Đổi mật khẩu</span>
                                        </div>
                                        <svg className="w-4 h-4" style={{color:'var(--text3)'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
                                    </button>
                                    <button onClick={() => setShowChangePin(true)}
                                        className="w-full p-4 flex justify-between items-center" style={{background:'var(--surface)'}}>
                                        <div className="flex items-center gap-3">
                                            <div className="w-9 h-9 bg-purple-50 rounded-xl flex items-center justify-center">
                                                <svg className="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                            </div>
                                            <span className="font-bold text-sm" style={{color:'var(--text)'}}>Đổi mã PIN</span>
                                        </div>
                                        <svg className="w-4 h-4" style={{color:'var(--text3)'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
                                    </button>
                                </div>
                                <button onClick={handleLogout} className="w-full p-4 rounded-2xl text-red-400 font-black text-sm border border-red-100 bg-red-50">Đăng xuất</button>
                            </div>
                        )}
                    </main>

                    {/* Navbar */}
                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] glass-nav rounded-[2.5rem] p-2 flex justify-between items-center shadow-2xl z-50" style={{maxWidth:'28rem'}}>
                        <button onClick={() => setActiveTab('dashboard')} className={`p-4 transition-all ${activeTab === 'dashboard' ? 'tab-active' : ''}`} style={{color: activeTab==='dashboard' ? '#2563eb' : 'var(--text3)'}}>
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                        </button>
                        <button onClick={() => setActiveTab('bills')} className={`p-4 transition-all`} style={{color: activeTab==='bills' ? '#2563eb' : 'var(--text3)'}}>
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        </button>
                        <button onClick={() => setActiveTab('history')} className={`p-4 transition-all`} style={{color: activeTab==='history' ? '#2563eb' : 'var(--text3)'}}>
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </button>
                        <button onClick={() => setActiveTab('manage')} className={`p-4 transition-all`} style={{color: activeTab==='manage' ? '#2563eb' : 'var(--text3)'}}>
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                        </button>
                        {isAdmin ? (
                            <button onClick={() => setActiveTab('admin')} className={`p-4 transition-all`} style={{color: activeTab==='admin' ? '#f59e0b' : 'var(--text3)'}}>
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                            </button>
                        ) : (
                            <button onClick={() => setActiveTab('settings')} className={`p-4 transition-all`} style={{color: activeTab==='settings' ? '#2563eb' : 'var(--text3)'}}>
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            </button>
                        )}
                    </nav>

                    {isFirstLogin && !showChangePw && (
                        <div className="fixed bottom-28 left-1/2 -translate-x-1/2 w-[88%] max-w-sm z-40 animate-fade-in">
                            <div className="p-4 rounded-2xl shadow-xl flex items-center gap-3" style={{background:'#2563eb'}}>
                                <svg className="w-8 h-8 text-white flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                                <div className="flex-1">
                                    <p className="font-black text-white text-xs">Lần đầu đăng nhập!</p>
                                    <p className="text-blue-100 text-[10px]">Hãy đổi mật khẩu cá nhân để bảo mật hơn</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowChangePw(true)} className="px-3 py-1.5 bg-white text-blue-600 rounded-xl text-[10px] font-black">Đổi ngay</button>
                                    <button onClick={() => setIsFirstLogin(false)} className="px-3 py-1.5 bg-blue-500 text-white rounded-xl text-[10px] font-black">Bỏ qua</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <ChangePwModal />
                    <ChangePinModal />

                    {/* MODAL NHÀ */}
                    <Modal isOpen={!!modals.house} onClose={() => setModals({...modals, house: null})} title={modals.house?.id ? "Sửa Nhà" : "Thêm Nhà Mới"}>
                        <Input label="Tên khu nhà" value={modals.house?.name} onChange={v => setModals({...modals, house: {...modals.house, name: v}})} placeholder="VD: Nhà Quận 1" />
                        <Input label="Địa chỉ" value={modals.house?.address} onChange={v => setModals({...modals, house: {...modals.house, address: v}})} placeholder="Số 10 Lê Lợi..." />
                        <div className="flex gap-3 mt-6">
                            {modals.house?.id && <button onClick={() => { 
                                const houseRoomIds = rooms.filter(r => r.houseId === modals.house.id).map(r => r.id);
                                setHouses(houses.filter(h => h.id !== modals.house.id)); 
                                setRooms(rooms.filter(r => r.houseId !== modals.house.id));
                                setBills(bills.filter(b => !houseRoomIds.includes(b.roomId)));
                                setExpenses(expenses.filter(e => e.houseId !== modals.house.id));
                                setModals({...modals, house: null}); 
                            }} className="flex-1 p-4 bg-red-50 text-red-500 font-bold rounded-2xl uppercase text-[10px] tracking-widest">Xóa</button>}
                            <button onClick={() => {
                                if (modals.house.id) setHouses(houses.map(h => h.id === modals.house.id ? modals.house : h));
                                else setHouses([...houses, {...modals.house, id: generateID()}]);
                                setModals({...modals, house: null});
                            }} className="flex-[2] p-4 bg-slate-900 text-white font-bold rounded-2xl shadow-xl">Lưu Nhà</button>
                        </div>
                    </Modal>

                    {/* MODAL PHÒNG */}
                    <Modal isOpen={!!modals.room} onClose={() => setModals({...modals, room: null})} title={modals.room?.id ? "Sửa Phòng" : "Thêm Phòng"}>
                        <div className="grid grid-cols-2 gap-3">
                            <Input label="Tên/Số phòng" value={modals.room?.name} onChange={v => setModals({...modals, room: {...modals.room, name: v}})} />
                            <Input label="Người thuê" value={modals.room?.occupants} onChange={v => setModals({...modals, room: {...modals.room, occupants: v}})} />
                        </div>
                        <Input label="Số người ở" type="number" value={modals.room?.numOccupants || 0} onChange={v => setModals({...modals, room: {...modals.room, numOccupants: v}})} suffix="người" />
                        <Input label="Giá phòng" type="number" value={modals.room?.rentPrice} onChange={v => setModals({...modals, room: {...modals.room, rentPrice: v}})} suffix="đ" />
                        <div className="grid grid-cols-2 gap-3">
                            <Input label="Giá điện" type="number" value={modals.room?.electricityPrice} onChange={v => setModals({...modals, room: {...modals.room, electricityPrice: v}})} />
                            <Input label="Số điện hiện tại" type="number" value={modals.room?.currentElectric} onChange={v => setModals({...modals, room: {...modals.room, currentElectric: v}})} />
                        </div>
                        <Input label="Giá nước (khoán/m3)" type="number" value={modals.room?.waterPrice} onChange={v => setModals({...modals, room: {...modals.room, waterPrice: v}})} suffix="đ" />
                        <div className="mt-2 mb-4">

                                <button onClick={() => {
                                    const fees = Array.isArray(modals.room?.otherFees) ? [...modals.room.otherFees] : [];
                                    fees.push({ id: generateID(), name: '', amount: 0 });
                                    setModals({...modals, room: {...modals.room, otherFees: fees}});
                                }} className="ml-3 text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full">+ Thêm</button>
                            </div>
                            <div className="space-y-2">
                                {(() => {
                                    let fees = modals.room?.otherFees;
                                    if (!fees) fees = [];
                                    if (!Array.isArray(fees)) {
                                        fees = Object.entries(fees).map(([name, amount]) => ({
                                            id: generateID(), name: name === 'internet' ? 'Internet' : name === 'waste' ? 'Rác/Vệ sinh' : name === 'parking' ? 'Giữ xe' : name, amount: Number(amount) || 0
                                        }));
                                    }
                                    return fees.map((fee, i) => (
                                        <div key={fee.id || i} className="flex gap-2 items-center">
                                            <input
                                                value={fee.name}
                                                onChange={e => {
                                                    const f = [...fees]; f[i] = {...f[i], name: e.target.value};
                                                    setModals({...modals, room: {...modals.room, otherFees: f}});
                                                }}
                                                placeholder="Tên phí (VD: Internet)"
                                                className="flex-1 p-3 rounded-xl border-2 border-transparent outline-none font-bold text-sm focus:border-blue-500"
                                                style={{background:'var(--input-bg)', color:'var(--text)'}}
                                            />
                                            <input
                                                type="text"
                                                value={formatNum(fee.amount)}
                                                onChange={e => {
                                                    const f = [...fees]; f[i] = {...f[i], amount: parseNum(e.target.value)};
                                                    setModals({...modals, room: {...modals.room, otherFees: f}});
                                                }}
                                                placeholder="0đ"
                                                className="w-28 p-3 rounded-xl border-2 border-transparent outline-none font-bold text-sm text-right focus:border-blue-500"
                                                style={{background:'var(--input-bg)', color:'var(--text)'}}
                                            />
                                            <button onClick={() => {
                                                const f = fees.filter((_, idx) => idx !== i);
                                                setModals({...modals, room: {...modals.room, otherFees: f}});
                                            }} className="p-2 rounded-xl text-red-400 flex-shrink-0" style={{background:'var(--surface2)'}}>
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                            </button>
                                        </div>
                                    ));
                                })()}
                                {((!modals.room?.otherFees) || (Array.isArray(modals.room?.otherFees) && modals.room.otherFees.length === 0)) && (
                                    <p className="text-center text-xs font-bold py-3" style={{color:'var(--text3)'}}>Chưa có phí — nhấn + Thêm để bổ sung</p>
                                )}
                            </div>
                        </div>
                        <button onClick={() => {
                            const room = {...modals.room};
                            if (!Array.isArray(room.otherFees)) {
                                room.otherFees = Object.entries(room.otherFees || {}).map(([name, amount]) => ({
                                    id: generateID(), name: name === 'internet' ? 'Internet' : name === 'waste' ? 'Rác/Vệ sinh' : name === 'parking' ? 'Giữ xe' : name, amount: Number(amount)||0
                                })).filter(f => f.name || f.amount > 0);
                            }
                            if (room.id) setRooms(rooms.map(r => r.id === room.id ? room : r));
                            else setRooms([...rooms, {...room, id: generateID()}]);
                            setModals({...modals, room: null});
                        }} className="w-full p-4 mt-2 font-bold rounded-2xl shadow-xl" style={{background:'var(--text)', color:'var(--bg)'}}>Lưu Phòng</button>
                        {modals.room?.id && <button onClick={() => {
                            setBills(bills.filter(b => b.roomId !== modals.room.id));
                            setRooms(rooms.filter(r => r.id !== modals.room.id));
                            setModals({...modals, room: null});
                        }} className="w-full mt-2 p-4 text-red-400 font-bold text-[10px] uppercase tracking-widest text-center">Xóa phòng này</button>}
                    </Modal>

                    {/* MODAL CHỐT ĐIỆN */}
                    <Modal isOpen={!!modals.bill} onClose={() => setModals({...modals, bill: null})} title={`Chốt điện P.${modals.bill?.room.name}`}>
                        {(() => {
                            const r = modals.bill?.room;
                            const newE = modals.bill?.newElectric || 0;
                            const oldE = r?.currentElectric || 0;
                            const eUsed = Math.max(0, newE - oldE);
                            const eCost = eUsed * (r?.electricityPrice || 0);
                            return (
                                <div>
                                    <div className="p-5 rounded-t-[2rem] rounded-b-xl border-x border-t" style={{background: 'var(--surface2)', borderColor: 'var(--border)'}}>
                                        <div className="flex justify-between items-center mb-4">
                                            <div>
                                                <p className="text-[10px] font-black uppercase tracking-widest mb-1" style={{color: 'var(--text3)'}}>Số điện cũ</p>
                                                <p className="text-2xl font-black" style={{color: 'var(--text)'}}>{oldE}</p>
                                            </div>
                                            <div className="text-center px-4">
                                                <svg className="w-6 h-6 mx-auto" style={{color: 'var(--border)'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-1">Số điện mới</p>
                                                <input type="number" autoFocus className="w-24 text-2xl font-black text-blue-600 bg-transparent border-b-2 border-blue-500 outline-none text-right placeholder-blue-200"
                                                    value={newE === 0 ? '' : newE} onChange={e => setModals({...modals, bill: {...modals.bill, newElectric: parseInt(e.target.value) || 0}})} placeholder="Nhập số..." />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="bg-blue-50 p-4 rounded-t-xl rounded-b-[2rem] border-x border-b border-blue-100 mb-4 flex justify-between items-center">
                                        <div>
                                            <p className="text-[10px] font-black text-blue-400 uppercase tracking-widest">Lượng tiêu thụ</p>
                                            <p className="text-lg font-black text-blue-600">{eUsed} <span className="text-xs">kWh</span></p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[10px] font-black text-blue-400 uppercase tracking-widest">Thành tiền điện</p>
                                            <p className="text-lg font-black text-blue-600">{formatVND(eCost)}</p>
                                        </div>
                                    </div>
                                    <div className="mb-4 p-4 rounded-2xl border" style={{background: 'var(--surface2)', borderColor: 'var(--border)'}}>
                                        <p className="text-[9px] font-black uppercase tracking-widest mb-3" style={{color: 'var(--text3)'}}>Công thức tính điện</p>
                                        <div className="flex items-center justify-between gap-2 text-xs font-black mb-2">
                                            <span className="px-2 py-1 bg-blue-100 text-blue-700 rounded-lg">{newE}</span>
                                            <span style={{color: 'var(--text3)'}}>−</span>
                                            <span className="px-2 py-1 rounded-lg" style={{background: 'var(--border)', color: 'var(--text2)'}}>{oldE}</span>
                                            <span style={{color: 'var(--text3)'}}>＝</span>
                                            <span className="px-2 py-1 bg-emerald-100 text-emerald-700 rounded-lg">{eUsed} kWh</span>
                                        </div>
                                        <div className="flex items-center justify-between gap-2 text-xs font-black">
                                            <span className="px-2 py-1 bg-emerald-100 text-emerald-700 rounded-lg">{eUsed} kWh</span>
                                            <span style={{color: 'var(--text3)'}}>×</span>
                                            <span className="px-2 py-1 rounded-lg" style={{background: 'var(--border)', color: 'var(--text2)'}}>{formatVND(r?.electricityPrice || 0)}</span>
                                            <span style={{color: 'var(--text3)'}}>＝</span>
                                            <span className="px-2 py-1 bg-blue-600 text-white rounded-lg">{formatVND(eCost)}</span>
                                        </div>
                                    </div>
                                    <div className="mb-4 p-4 rounded-2xl border" style={{background: 'var(--surface)', borderColor: 'var(--border)'}}>
                                        <p className="text-[9px] font-black uppercase tracking-widest mb-3" style={{color: 'var(--text3)'}}>Tổng các khoản</p>
                                        <div className="space-y-2 text-xs">
                                            <div className="flex justify-between"><span style={{color: 'var(--text2)'}}>Tiền phòng</span><span className="font-black" style={{color: 'var(--text)'}}>{formatVND(r?.rentPrice)}</span></div>
                                            <div className="flex justify-between"><span style={{color: 'var(--text2)'}}>Tiền điện ({eUsed} kWh)</span><span className="font-black text-blue-600">{formatVND(eCost)}</span></div>
                                            <div className="flex justify-between"><span style={{color: 'var(--text2)'}}>Tiền nước</span><span className="font-black" style={{color: 'var(--text)'}}>{formatVND(r?.waterPrice)}</span></div>
                                            {(() => {
                                                const fees = r?.otherFees || [];
                                                if (Array.isArray(fees)) return fees.filter(f => f.amount > 0).map((f, i) => (
                                                    <div key={i} className="flex justify-between"><span style={{color: 'var(--text2)'}}>{f.name || 'Phí khác'}</span><span className="font-black" style={{color: 'var(--text)'}}>{formatVND(f.amount)}</span></div>
                                                ));
                                                return Object.entries(fees).filter(([,v]) => v > 0).map(([k, v]) => (
                                                    <div key={k} className="flex justify-between"><span style={{color: 'var(--text2)'}}>{k}</span><span className="font-black" style={{color: 'var(--text)'}}>{formatVND(v)}</span></div>
                                                ));
                                            })()}
                                            <div className="border-t pt-2 flex justify-between" style={{borderColor: 'var(--border)'}}>
                                                <span className="font-black" style={{color: 'var(--text)'}}>Tổng cộng</span>
                                                <span className="font-black text-emerald-600 text-sm">{formatVND((r?.rentPrice||0) + eCost + (r?.waterPrice||0) + (Array.isArray(r?.otherFees) ? r.otherFees.reduce((s,f)=>s+(Number(f.amount)||0),0) : Object.values(r?.otherFees||{}).reduce((s,v)=>s+(Number(v)||0),0)))}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}
                        <div className="mb-6 p-4 rounded-2xl border shadow-sm" style={{background: 'var(--surface)', borderColor: 'var(--border)'}}>
                            <p className="text-[10px] font-black uppercase tracking-widest mb-3 text-center" style={{color: 'var(--text3)'}}>Biểu đồ tiêu thụ 4 tháng gần nhất</p>
                            <BillChart roomId={modals.bill?.room.id} currentMonth={currentMonth} newElectric={modals.bill?.newElectric} />
                        </div>
                        <button onClick={() => {
                            const r = modals.bill.room;
                            const used = modals.bill.newElectric - r.currentElectric;
                            if (used < 0) return alert("Số điện mới phải lớn hơn hoặc bằng số cũ!");
                            const eTotal = used * r.electricityPrice;
                            const otherFees = r.otherFees || [];
                            const others = Array.isArray(otherFees)
                                ? otherFees.reduce((s, f) => s + (Number(f.amount) || 0), 0)
                                : Object.values(otherFees).reduce((s, v) => s + (Number(v) || 0), 0);
                            const total = (r.rentPrice || 0) + (r.waterPrice || 0) + eTotal + others;
                            const newBill = {
                                id: generateID(),
                                roomId: r.id,
                                houseId: r.houseId,
                                month: currentMonth,
                                date: new Date().toLocaleDateString('vi-VN'),
                                oldElectric: r.currentElectric,
                                newElectric: modals.bill.newElectric,
                                eUsed: used,
                                total,
                                paid: false,
                                details: { ...r, eTotal }
                            };
                            setBills([...bills, newBill]);
                            setRooms(rooms.map(rm => rm.id === r.id ? {...rm, currentElectric: modals.bill.newElectric} : rm));
                            setModals({...modals, bill: null, invoice: newBill});
                        }} className="w-full p-5 bg-blue-600 text-white font-black rounded-[1.5rem] shadow-xl shadow-blue-100">Lưu chốt số & Xem hóa đơn</button>
                    </Modal>

                    {/* MODAL HÓA ĐƠN */}
                    <InvoiceModal
                        invoice={modals.invoice}
                        onClose={() => setModals({...modals, invoice: null})}
                        settings={settings}
                        bills={bills}
                        rooms={rooms}
                        BillChart={BillChart}
                    />

                    {/* MODAL SỔ THU TIỀN */}
                    <PaymentLogModal
                        bill={modals.paymentLog}
                        onClose={() => setModals({...modals, paymentLog: null})}
                        paymentLogs={paymentLogs}
                        setPaymentLogs={setPaymentLogs}
                        bills={bills}
                        setBills={setBills}
                        rooms={rooms}
                    />

                    {/* MODAL CHI PHÍ */}
                    <Modal isOpen={!!modals.expense} onClose={() => setModals({...modals, expense: null})} title={modals.expense?.id ? "Sửa Khoản Chi" : "Thêm Khoản Chi"}>
                        <Input label="Tên khoản chi" value={modals.expense?.name} onChange={v => setModals({...modals, expense: {...modals.expense, name: v}})} placeholder="VD: Sửa ống nước P.101" />
                        <Input label="Số tiền" type="number" value={modals.expense?.amount} onChange={v => setModals({...modals, expense: {...modals.expense, amount: v}})} suffix="đ" />
                        <button onClick={() => {
                            if (modals.expense.id) setExpenses(expenses.map(e => e.id === modals.expense.id ? modals.expense : e));
                            else setExpenses([...expenses, {...modals.expense, id: generateID(), month: currentMonth}]);
                            setModals({...modals, expense: null});
                        }} className="w-full p-4 mt-4 bg-slate-900 text-white font-bold rounded-2xl shadow-xl">Lưu Khoản Chi</button>
                        {modals.expense?.id && <button onClick={() => { setExpenses(expenses.filter(e => e.id !== modals.expense.id)); setModals({...modals, expense: null}); }} className="w-full mt-2 p-4 text-red-400 font-bold text-[10px] uppercase tracking-widest text-center">Xóa khoản chi này</button>}
                    </Modal>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
